          """
          
          import io
          import os
          import re
          import sys
          
          
          def parses(text):
              try:
                  import ast
                  ast.parse(text)
                  return True, ''
              except SyntaxError as e:
                  return False, 'line %s: %s' % (e.lineno, e.msg)
          
          
          # ---------------------------------------------------------------- 行级改写规则
          # 每条: (正则, 替换函数)  按顺序应用, 全部 multiline
          LINE_RULES = [
              # --- print >>stream, args   (必须先于普通 print 处理) ---
              (
                  r"(?m)^([ \t]*)print[ \t]*>>[ \t]*([^,\n]+?)[ \t]*,[ \t]*(.+?)[ \t]*$",
                  lambda m: "%sprint(%s, file=%s)" % (m.group(1), m.group(3), m.group(2).strip()),
              ),
              # --- print "msg", var ...  (字符串开头, 后面还有参数) ---
              (
                  r'(?m)^([ \t]*)print[ \t]+("(?:[^"\\\n]|\\.)*"|\'(?:[^\'\\\n]|\\.)*\')[ \t]*,[ \t]*(.+?)[ \t]*$',
                  lambda m: "%sprint(%s, %s)" % (m.group(1), m.group(2), m.group(3)),
              ),
              # --- print "msg"  (纯字符串, 无逗号) ---
              (
                  r'(?m)^([ \t]*)print[ \t]+("(?:[^"\\\n]|\\.)*"|\'(?:[^\'\\\n]|\\.)*\')[ \t]*$',
                  lambda m: "%sprint(%s)" % (m.group(1), m.group(2)),
              ),
              # --- print var,   (末尾逗号 => py2 不换行)   注意 [] 内可以有 . 和下标 ---
              (
                  r"(?m)^([ \t]*)print[ \t]+([A-Za-z_][A-Za-z0-9_.\[\]'\"]*)[ \t]*,[ \t]*$",
                  lambda m: "%sprint(%s, end='')" % (m.group(1), m.group(2)),
              ),
              # --- print var   (无逗号无引号) ---
              (
                  r"(?m)^([ \t]*)print[ \t]+([A-Za-z_][A-Za-z0-9_.\[\]]*)[ \t]*$",
                  lambda m: "%sprint(%s)" % (m.group(1), m.group(2)),
              ),
              # --- print 数字/其它字面量, ---
              (
                  r"(?m)^([ \t]*)print[ \t]+([0-9][A-Za-z0-9_.]*)[ \t]*,[ \t]*$",
                  lambda m: "%sprint(%s, end='')" % (m.group(1), m.group(2)),
              ),
              (
                  r"(?m)^([ \t]*)print[ \t]+([0-9][A-Za-z0-9_.]*)[ \t]*$",
                  lambda m: "%sprint(%s)" % (m.group(1), m.group(2)),
              ),
              # --- except X, e:  ->  except X as e: ---
              (
                  r"(?m)^([ \t]*)except[ \t]+([^:\n,]+?)[ \t]*,[ \t]*([A-Za-z_]\w*)[ \t]*:",
                  lambda m: "%sexcept %s as %s:" % (m.group(1), m.group(2).strip(), m.group(3)),
              ),
              # --- shebang ---
              (
                  r"(?m)^#![ \t]*.*python2[ \t]*$",
                  lambda m: "#!/usr/bin/env python3",
              ),
          ]
          
          # ---------------------------------------------------------------- 全域替换
          TOKEN_RULES = [
              (r"\bxrange\b", "range"),
              (r"\bbasestring\b", "str"),
              (r"\bunicode\b", "str"),
              (r"\blong\s*\(", "int("),
          ]
          
          # ------------------------------------------------ Py2/Py3 运行时语义差异修复
          # Py2: subprocess.Popen(...).stderr 迭代出 str (=bytes)
          # Py3: 迭代出 bytes -> 后续 str 操作 (rstrip('\n') / re.match(str)) 会 TypeError
          # 修法: 给 Popen 加 universal_newlines=True, 让 stdout/stderr 以文本模式返回
          RUNTIME_RULES = [
              # subprocess.Popen(args, stderr=subprocess.PIPE)
              #   -> subprocess.Popen(args, stderr=subprocess.PIPE, universal_newlines=True)
              (
                  r"subprocess\.Popen\(([^)]*?stderr\s*=\s*subprocess\.PIPE)([^)]*)\)",
                  lambda m: "subprocess.Popen(%s%s, universal_newlines=True)"
                            % (m.group(1), m.group(2)),
              ),
              # Popen(args, stdout=subprocess.PIPE) 同理
              (
                  r"subprocess\.Popen\(([^)]*?stdout\s*=\s*subprocess\.PIPE)(?!.*universal_newlines)([^)]*)\)",
                  lambda m: "subprocess.Popen(%s%s, universal_newlines=True)"
                            % (m.group(1), m.group(2)),
              ),
          ]
          
          
          def convert(src):
              applied = []
              for pat, repl in LINE_RULES:
                  src, n = re.subn(pat, repl, src)
                  if n:
                      applied.append("rule x%d" % n)
              for pat, rep in TOKEN_RULES:
                  src, n = re.subn(pat, rep, src)
                  if n:
                      applied.append("tok x%d" % n)
              for pat, repl in RUNTIME_RULES:
                  src, n = re.subn(pat, repl, src)
                  if n:
                      applied.append("runtime x%d" % n)
              # 去掉重复注入的 universal_newlines
              src = re.sub(r"(universal_newlines=True)(\s*,\s*universal_newlines=True)+",
                           r"\1", src)
              return src, applied
          
          
          def find_residue(text):
              """找出仍无法解析的可疑 py2 print 语句行"""
              bad = []
              for i, l in enumerate(text.split('\n'), 1):
                  if re.match(r'^\s*print\s+[^(=\s]', l) or re.match(r'^\s*print\s*>>', l):
                      bad.append((i, l.rstrip()))
              return bad
          
          
          def main():
              if len(sys.argv) < 2:
                  print('用法: python3 fix_gcc_wrapper_v2.py <path>')
                  return 2
          
              path = sys.argv[1]
              if not os.path.isfile(path):
                  print('[FAIL] 文件不存在: %s' % path)
                  return 1
          
              src = io.open(path, 'r', encoding='utf-8', errors='ignore').read()
          
              ok, err = parses(src)
              if ok:
                  print('[SKIP] %s 已可被 Python3 解析' % path)
                  return 0
          
              print('[INFO] 当前解析失败: %s' % err)
          
              new, applied = convert(src)
          
              ok2, err2 = parses(new)
              if not ok2:
                  # 第二轮: 对残留行做逐行强制改写 (兜底)
                  lines = new.split('\n')
                  for i, l in enumerate(lines):
                      m = re.match(r'^([ \t]*)print\s+(.+?)\s*,\s*$', l)
                      if m:
                          lines[i] = "%sprint(%s, end='')" % (m.group(1), m.group(2))
                          continue
                      m = re.match(r'^([ \t]*)print\s+(.+)$', l)
                      if m and not m.group(2).startswith('('):
                          lines[i] = "%sprint(%s)" % (m.group(1), m.group(2))
                  new = '\n'.join(lines)
                  ok3, err3 = parses(new)
                  if not ok3:
                      print('[FAIL] 两轮转换后仍无法解析: %s' % err3)
                      for ln, txt in find_residue(new):
                          print('      残留 L%d: %s' % (ln, txt))
                      return 1
                  applied.append('force-pass')
          
              io.open(path, 'w', encoding='utf-8', newline='\n').write(new)
              print('[OK]   %s 已转换为 Python3' % path)
              print('       应用规则: %s' % (', '.join(applied) or '无'))
          
              # 语义自检
              checks = [
                  ("不换行语义 print(..., end='')", "end=''"),
                  ("forbidden warning 输出", 'error, forbidden warning'),
                  ("保留 sys.exit(1)", 'sys.exit(1)'),
                  ("保留 subprocess.Popen", 'subprocess.Popen'),
                  ("保留 stderr 透传循环", 'proc.stderr'),
              ]
              for name, needle in checks:
                  print('       [%s] %s' % ('OK' if needle in new else 'WARN', name))
          
              # 残留检查
              res = find_residue(new)
              if res:
                  print('       [WARN] 仍有疑似 py2 print 残留 %d 处' % len(res))
              else:
                  print('       [OK] 无 py2 print 残留')
          
              return 0
          
          sys.exit(main())
          
          
          
          
          PYFIX
          
              # 复验: 能否被 Python3 解析
              if python3 -c "import ast,io,sys; ast.parse(io.open(sys.argv[1],encoding='utf-8',errors='ignore').read())" "$w" 2>/dev/null; then
