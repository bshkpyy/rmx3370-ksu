              # 真实文件结构 (已验证, 76 行, Python 2):
              #   L1  #! /usr/bin/env python2
              #   L34 print "error, forbidden warning:", m.group(2)
              #   L59 print line,                        <--- 末尾逗号 = 不换行!
              #   L66 print args[0] + ':',e.strerror
              #   L67 print 'Is your PATH set correctly?'
              #   L69 print ' '.join(args), str(e)
