          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """
          gcc-wrapper.py  Python 2 -> Python 3 转换器 (v2, 行号无关)
          =========================================================
          v1 的问题: 精确行号表按真实文件写的 (L1/L34/L59/L66/L67/L69),
                     一旦文件的注释/空行数变化, 行号全部漂移, 精确表失效,
                     而泛化兜底的正则又漏掉了 `print line,` 这类形态。
          
          v2 的解法: 完全放弃行号依赖, 改用**语义化正则 + Python tokenize 校验**,
                     覆盖 Python 2 print 语句的全部语法形态。
          
          覆盖的 Py2 → Py3 改写:
              print "msg"                  -> print("msg")
              print "msg", var             -> print("msg", var)
              print var                    -> print(var)
              print var,                   -> print(var, end='')      <-- 不换行语义
              print >>sys.stderr, "msg"    -> print("msg", file=sys.stderr)
              print >>f, a, b              -> print(a, b, file=f)
              except X, e:                 -> except X as e:
              xrange(...)                  -> range(...)
              #!/usr/bin/env python2       -> python3
              raise E, v                   -> raise E(v)
              E, v = ...; raise E, v       -> 不动 (太罕见, 交给 ast 校验兜底)
          
