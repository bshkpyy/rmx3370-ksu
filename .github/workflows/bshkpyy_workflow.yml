name: Build KernelSU for Realme GT Neo2 (RMX3370 / RE5473 / kona / Android 13)

# ============================================================================
# 目标设备: realme GT Neo2 (RMX3370 / 国内工程代号 RE5473 / 社区代号 bitra)
# 平台    : Qualcomm kona (SM8250, 骁龙 870)
# 内核    : Linux 4.19.157 (OPLUS Android T 分支, 非 GKI 2.0)
# 方案    : KernelSU 内置模式 (CONFIG_KSU=y) + 手动 syscall hook 补丁
#          (4.19 非 GKI 不支持 LKM, 必须 built-in)
# 产出    : AnyKernel3-RMX3370-RealmeUI4-KSU.zip  与  独立 Image
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU 分支 (4.19 非 GKI 只能用 kernelsu-next legacy 或 official v0.9.5)'
        required: true
        default: 'kernelsu-next'
        type: choice
        options:
          - 'kernelsu-next'
          - 'official-v0.9.5'
      hook_mode:
        description: 'Hook 模式 (kona 4.19 强烈建议 manual, 开 kprobe 常见卡开机)'
        required: true
        default: 'manual'
        type: choice
        options:
          - 'manual'
          - 'kprobe'
      kernel_repo:
        description: 'OPLUS 内核源码仓库 (默认官方 realme-kernel-opensource)'
        required: false
        default: 'https://github.com/realme-kernel-opensource/realme_GTneo2-Q5pro-GTMasterExploratory-AndroidT-kernel-source.git'
        type: string
      defconfig_override:
        description: '手动指定 defconfig (相对 arch/arm64/configs/)。留空=自动探测 vendor/kona-perf_defconfig'
        required: false
        default: ''
        type: string
      disable_gcc_wrapper:
        description: '禁用 OPLUS 遗留的 Python2 gcc-wrapper.py (必开, 否则 defconfig 阶段就崩)'
        required: true
        default: true
        type: boolean
      use_ccache:
        description: '启用 ccache 加速'
        required: true
        default: true
        type: boolean

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ----------------------------------------------------------------------
      # 0. 前置: 在任何步骤之前先建诊断目录并落盘环境信息
      #    这样即使第一步就失败, always() 的归档步骤也有东西可传
      # ----------------------------------------------------------------------
      - name: 0.1 初始化诊断目录与环境快照
        run: |
          set +e
          DIAG="$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$DIAG"
          {
            echo "================= 环境快照 (job 起始) ================="
            echo "run_id          : ${GITHUB_RUN_ID}"
            echo "run_number      : ${GITHUB_RUN_NUMBER}"
            echo "run_attempt     : ${GITHUB_RUN_ATTEMPT}"
            echo "repository      : ${GITHUB_REPOSITORY}"
            echo "ref             : ${GITHUB_REF}"
            echo "sha             : ${GITHUB_SHA}"
            echo "actor           : ${GITHUB_ACTOR}"
            echo "event           : ${GITHUB_EVENT_NAME}"
            echo "runner_os       : ${RUNNER_OS}"
            echo "runner_arch     : ${RUNNER_ARCH}"
            echo "runner_name     : ${RUNNER_NAME}"
            echo "runner_image    : ${ImageOS:-unknown}"
            echo "workspace       : ${GITHUB_WORKSPACE}"
            echo "started_utc     : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "================= 输入参数 ================="
            echo "ksu_variant       : ${{ inputs.ksu_variant }}"
            echo "hook_mode         : ${{ inputs.hook_mode }}"
            echo "kernel_repo       : ${{ inputs.kernel_repo }}"
            echo "defconfig_override: '${{ inputs.defconfig_override }}'"
            echo "use_ccache        : ${{ inputs.use_ccache }}"
            echo
            echo "================= 磁盘 ================="
            df -h /
            echo
            echo "================= CPU / 内存 ================="
            nproc --all
            free -h
          } > "$DIAG/summary.txt" 2>&1
          cat "$DIAG/summary.txt"


      # ----------------------------------------------------------------------
      # 1. 环境准备
      # ----------------------------------------------------------------------
      - name: 1.1 释放磁盘空间 (内核编译需要 30G+)
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 1.2 安装编译依赖
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python-is-python3 python3 rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev dwarves pahole device-tree-compiler cpio unzip \
            libfdt-dev libgmp-dev libmpc-dev aria2

      - name: 1.3 配置 ccache
        if: ${{ inputs.use_ccache }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: rmx3370-kona-4.19-${{ inputs.ksu_variant }}

      # ----------------------------------------------------------------------
      # 2. 拉取 OPLUS Android T 内核源码
      #    OPLUS 源码树内的相对 include 依赖 "kernel/msm-4.19" 层级,
      #    因此必须把 msm-4.19 放在 <workspace>/kernel/msm-4.19
      # ----------------------------------------------------------------------
      - name: 2.1 克隆 realme GT Neo2 Android T 内核源码
        run: |
          set -eux
          TARGET="$GITHUB_WORKSPACE/oplus/kernel/msm-4.19"
          mkdir -p "$GITHUB_WORKSPACE/oplus/kernel"

          # 幂等: 目录已存在且是有效 git 树则跳过
          if [ -d "$TARGET/.git" ]; then
            echo ">>> $TARGET 已存在有效仓库, 跳过克隆"
          else
            # 重试前必须清掉残留目录, 否则第二次 clone 会因目标非空而失败
            rm -rf "$TARGET"
            ok=0
            for attempt in 1 2 3; do
              echo ">>> 克隆尝试 $attempt/3"
              if git clone --depth=1 --branch "${KERNEL_BRANCH:-master}" \
                   "${{ inputs.kernel_repo }}" "$TARGET"; then
                ok=1; break
              fi
              rm -rf "$TARGET"
              # 第二、三次改为不带 --branch, 让它用默认分支
              if [ "$attempt" -ge 2 ]; then
                if git clone --depth=1 "${{ inputs.kernel_repo }}" "$TARGET"; then
                  ok=1; break
                fi
                rm -rf "$TARGET"
              fi
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error:: 内核源码克隆失败 (3 次尝试均未成功)"
              exit 1
            fi
          fi

          cd "$TARGET"
          git log -1 --oneline
          echo "--- 内核版本 ---"
          head -5 Makefile
          VERSION_LINE=$(grep -m1 -E '^(VERSION|PATCHLEVEL|SUBLEVEL)\s*=' Makefile || true)
          echo "$VERSION_LINE" || true
          echo "SRC_DIR=$TARGET" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # 3. 工具链
      #    重要: android.googlesource.com 的 +archive/<ref>/<path>.tar.gz 端点
      #    对 clang-rXXXXXX 这类目录返回 400, 会让 aria2c 落盘一个非 gzip 文件,
      #    随后 tar 报 "not in gzip format" 并以 exit 2 终止 job。
      #    这里改用 GitHub Release 上真正带 bin/clang 的 pinned 预编译包。
      #    Clang 14 是 4.19 / sm8250 的黄金版本 (15+ 会对 4.19 大量报错)。
      # ----------------------------------------------------------------------
      - name: 3.1 下载 Clang 14.0.6 工具链 (pinned, 带预编译二进制)
        env:
          CLANG_URL: https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20261011-release/Clang-14.0.6-20261011.tar.gz
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          curl -LSs --retry 5 --retry-delay 5 --retry-all-errors \
               --connect-timeout 30 --max-time 900 \
               -o clang.tar.gz "$CLANG_URL"

          # 体积与 gzip 魔数双重校验, 防止把错误页当压缩包
          ls -lh clang.tar.gz
          SIZE=$(stat -c%s clang.tar.gz)
          if [ "$SIZE" -lt 100000000 ]; then
            echo "::error:: Clang 压缩包体积异常 (${SIZE} bytes), 下载失败"
            exit 1
          fi
          if ! gzip -t clang.tar.gz 2>/dev/null; then
            echo "::error:: clang.tar.gz 不是合法 gzip 文件"
            head -c 300 clang.tar.gz || true
            exit 1
          fi

          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

          # 不同打包方式的目录层级可能不同, 统一定位到含 bin/clang 的那一层
          if [ ! -x clang/bin/clang ]; then
            inner=$(find clang -maxdepth 3 -type f -name clang -path '*/bin/*' | head -n1 || true)
            if [ -n "$inner" ]; then
              inner_root=$(dirname "$(dirname "$inner")")
              echo ">>> 提升工具链根目录: $inner_root"
              mv clang clang_tmp
              mv clang_tmp/*/* clang/ 2>/dev/null || mv "$inner_root" clang_full
              if [ -d clang_full ]; then rm -rf clang; mv clang_full clang; fi
              rm -rf clang_tmp
            fi
          fi

          test -x clang/bin/clang || { echo "::error:: 未找到 clang/bin/clang"; find clang -maxdepth 3 -type d | head -30; exit 1; }
          ./clang/bin/clang --version
          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang" >> "$GITHUB_ENV"

      - name: 3.2 下载 AArch64 / ARM32 GCC 交叉编译器
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/toolchains"
          git clone --depth=1 https://github.com/arter97/arm64-gcc.git gcc64
          git clone --depth=1 https://github.com/arter97/arm32-gcc.git gcc32
          test -x gcc64/bin/aarch64-unknown-linux-gnu-gcc || { echo "::error:: gcc64 缺少 aarch64 交叉 gcc"; ls gcc64/bin | head -30; exit 1; }
          test -x gcc32/bin/arm-unknown-linux-gnueabi-gcc || { echo "::error:: gcc32 缺少 arm32 交叉 gcc"; ls gcc32/bin | head -30; exit 1; }
          echo ">>> 交叉编译器就绪"
          gcc64/bin/aarch64-unknown-linux-gnu-gcc --version | head -1
          gcc32/bin/arm-unknown-linux-gnueabi-gcc --version | head -1
          echo "GCC64_DIR=$GITHUB_WORKSPACE/toolchains/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$GITHUB_WORKSPACE/toolchains/gcc32" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # 4. 修正 OPLUS 源码深层相对 include
      #    关键修正: 上一版把整个 #include 替换成 "#include <>" 直接废源码。
      #    这里改为把 "../../../kernel/xxx.h" 归一化成 "xxx.h",
      #    因为 msm-4.19 已经是相对层级中的最后一跳。
      # ----------------------------------------------------------------------
      - name: 4.1 归一化 OPLUS 深层相对 include
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          set -eu
          if [ ! -f Makefile ] || [ ! -d fs ]; then
            echo "::error:: 内核源码树不完整 (缺少 Makefile 或 fs/), 无法归一化"
            pwd; ls -la
            exit 1
          fi
          python3 - <<'PYEOF'
          import os, re, sys

          root = os.getcwd()
          if not os.path.isdir(os.path.join(root, 'fs')):
              print('::error:: fs/ 目录不存在, 源码树异常')
              sys.exit(1)

          # 匹配 #include "../../..(/..)*/kernel/msm-4.19/xxx.h" 以及
          #      #include "../../../kernel/xxx.h" 两种形态
          pat = re.compile(
              r'#include\s*([<"])(?:\.\./)+kernel/(?:msm-4\.19/)?([^">\n]+)([>"])',
              re.MULTILINE)

          fixed_files = 0
          fixed_hits = 0
          scanned = 0
          for dirpath, dirnames, filenames in os.walk(root):
              # 跳过 .git / 构建产物
              dirnames[:] = [d for d in dirnames if d not in ('.git', 'out')]
              for fn in filenames:
                  if not fn.endswith(('.c', '.h', '.S', '.cpp', '.cc')):
                      continue
                  scanned += 1
                  fpath = os.path.join(dirpath, fn)
                  try:
                      with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                  except Exception:
                      continue
                  if 'kernel/msm-4.19' not in content and '../kernel/' not in content:
                      continue
                  # 重写为同一源码树根起算的普通 include (去掉所有 ../kernel 前缀)
                  new_content, n = pat.subn(lambda m: '#include %s%s%s' % (m.group(1), m.group(2), m.group(3)), content)
                  if n:
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      fixed_files += 1
                      fixed_hits += n
                      print('[FIX] %s  (%d 处)' % (os.path.relpath(fpath, root), n))
          print('[OPLUS-Normalize] 扫描 %d 个源文件, 修正 %d 个文件 / %d 处 include'
                % (scanned, fixed_files, fixed_hits))
          if scanned == 0:
              print('::error:: 扫描到 0 个源文件, 源码树路径错误')
              sys.exit(1)
          PYEOF

      # ----------------------------------------------------------------------
      # 5. 集成 KernelSU 源码
      # ----------------------------------------------------------------------
      - name: 5.1 集成 KernelSU 源码 (非 GKI 分支)
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          set -eux
          rm -rf KernelSU

          fetch_setup() {
            # $1=首选URL $2=备用URL $3=输出文件
            for u in "$1" "$2"; do
              [ -z "$u" ] && continue
              echo ">>> 尝试: $u"
              if curl -LSs --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 120 -o "$3" "$u"; then
                if [ -s "$3" ] && head -c 64 "$3" | grep -q 'setup\|#!\|^[a-zA-Z]'; then
                  return 0
                fi
              fi
              sleep 3
            done
            return 1
          }

          if [ "${{ inputs.ksu_variant }}" = "kernelsu-next" ]; then
            echo ">>> KernelSU-Next (next 分支, legacy 集成)"
            fetch_setup \
              "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
              "https://cdn.jsdelivr.net/gh/KernelSU-Next/KernelSU-Next@next/kernel/setup.sh" \
              /tmp/ksu_setup.sh \
              || { echo "::error:: KernelSU-Next setup.sh 下载失败"; exit 1; }
            bash /tmp/ksu_setup.sh legacy
          else
            echo ">>> 原版 KernelSU v0.9.5 (最后支持非 GKI 的版本)"
            fetch_setup \
              "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
              "https://cdn.jsdelivr.net/gh/tiann/KernelSU@main/kernel/setup.sh" \
              /tmp/ksu_setup.sh \
              || { echo "::error:: KernelSU setup.sh 下载失败"; exit 1; }
            bash /tmp/ksu_setup.sh v0.9.5
          fi

          if [ ! -d KernelSU ]; then
            echo "::error:: setup.sh 执行后未生成 KernelSU 目录"
            ls -la
            exit 1
          fi
          echo ">>> KernelSU 目录已就绪"
          ls KernelSU/ | head -20

      # ----------------------------------------------------------------------
      # 6. 手动 syscall hook 补丁 (仅 manual 模式)
      #    修正点: 
      #      - heredoc 全部正确缩进到 YAML 块内
      #      - 补丁锚点改为「函数签名之后的第一个 {」, 不依赖 argv/envp 具体类型
      #      - 加入已打补丁检测, 幂等
      #      - 匹配失败时打印上下文而不是静默退出
      # ----------------------------------------------------------------------
      - name: 6.1 注入 4.19 非 GKI 系统调用 Hook
        if: ${{ inputs.hook_mode == 'manual' }}
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          cat > /tmp/ksu_patch.py <<'PYEOF'
          import os, re, sys

          OK, SKIP, FAIL = 0, 0, 0

          def read(fp):
              with open(fp, 'r', encoding='utf-8', errors='ignore') as f:
                  return f.read()

          def write(fp, s):
              with open(fp, 'w', encoding='utf-8') as f:
                  f.write(s)

          def inject_block(fp, marker, anchor_re, header, inject, label):
              """
              anchor_re 必须捕获 (前面的函数签名 + 行尾的 '{')
              header 插到文件最顶部 (extern 声明区)
              inject 插到函数体第一个 '{' 之后
              幂等: 文件已含 marker 则跳过
              """
              global OK, SKIP, FAIL
              if not os.path.exists(fp):
                  print('[FAIL] 文件不存在: %s' % fp)
                  FAIL += 1
                  return
              src = read(fp)
              if marker in src:
                  print('[SKIP] %s 已含 %s' % (fp, marker))
                  SKIP += 1
                  return

              new_src, n = re.subn(
                  anchor_re,
                  lambda m: m.group(0) + inject,
                  src,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL)
              if n == 0:
                  print('[FAIL] 未能匹配 %s 中的 %s 锚点 (%s)' % (fp, label, marker))
                  for mm in re.finditer(r'\b%s\b' % re.escape(label.split('(')[0]), src):
                      s = max(0, mm.start() - 250)
                      print('  ...疑似上下文...')
                      print(src[s:mm.start() + 500])
                      break
                  FAIL += 1
                  return

              if header not in new_src:
                  new_src = header + new_src
              write(fp, new_src)
              print('[OK]   %s 注入 %s' % (fp, marker))
              OK += 1

          # ---------------- 1) fs/exec.c : do_execveat_common ----------------
          inject_block(
              'fs/exec.c',
              'ksu_handle_execveat',
              r'(static int do_execveat_common\s*\([^)]*\)\s*\{)',
              '#ifdef CONFIG_KSU\n'
              'extern bool ksu_execveat_hook __read_mostly;\n'
              'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n'
              'extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n'
              '#endif\n\n',
              '\n#ifdef CONFIG_KSU\n'
              '\tif (unlikely(ksu_execveat_hook))\n'
              '\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n'
              '\telse\n'
              '\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n'
              '#endif\n',
              'do_execveat_common')

          # ---------------- 2) fs/open.c : faccessat ----------------
          # 4.19 标准: SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          inject_block(
              'fs/open.c',
              'ksu_handle_faccessat',
              r'(SYSCALL_DEFINE3\s*\(\s*faccessat\s*,[^)]*\)\s*\{)',
              '#ifdef CONFIG_KSU\n'
              'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n'
              '#endif\n\n',
              '\n#ifdef CONFIG_KSU\n'
              '\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n'
              '#endif\n',
              'faccessat')

          # ---------------- 2b) fs/open.c : faccessat2 (4.19 部分分支已回移) ----------------
          _op = 'fs/open.c'
          if not os.path.exists(_op):
              print('[FAIL] 文件不存在: %s' % _op)
              FAIL += 1
          elif 'SYSCALL_DEFINE4(faccessat2' not in read(_op):
              print('[N/A]  %s 无 faccessat2 (OPLUS 该分支未回移), 跳过' % _op)
          elif 'ksu_handle_faccessat2' in read(_op):
              print('[SKIP] %s 已含 ksu_handle_faccessat2' % _op)
              SKIP += 1
          else:
              inject_block(
                  _op,
                  'ksu_handle_faccessat2',
                  r'(SYSCALL_DEFINE4\s*\(\s*faccessat2\s*,[^)]*\)\s*\{)',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_faccessat2(int *dfd, const char __user **filename_user, int *mode, int *flags);\n'
                  '#endif\n\n',
                  '\n#ifdef CONFIG_KSU\n'
                  '\tksu_handle_faccessat2(&dfd, &filename, &mode, &flags);\n'
                  '#endif\n',
                  'faccessat2')

          # ---------------- 3) fs/read_write.c : vfs_read ----------------
          inject_block(
              'fs/read_write.c',
              'ksu_handle_vfs_read',
              r'(ssize_t vfs_read\s*\([^)]*\)\s*\{)',
              '#ifdef CONFIG_KSU\n'
              'extern bool ksu_vfs_read_hook __read_mostly;\n'
              'extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n'
              '#endif\n\n',
              '\n#ifdef CONFIG_KSU\n'
              '\tif (unlikely(ksu_vfs_read_hook))\n'
              '\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n'
              '#endif\n',
              'vfs_read')

          # ---------------- 4) fs/stat.c : vfs_statx ----------------
          inject_block(
              'fs/stat.c',
              'ksu_handle_stat',
              r'(int vfs_statx\s*\([^)]*\)\s*\{)',
              '#ifdef CONFIG_KSU\n'
              'extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n'
              '#endif\n\n',
              '\n#ifdef CONFIG_KSU\n'
              '\tksu_handle_stat(&dfd, &filename, &flags);\n'
              '#endif\n',
              'vfs_statx')

          # ---------------- 5) kernel/reboot.c : reboot ----------------
          # OPLUS 4.19 部分分支把最后参数名写成 argp 而非 arg, 这里自动捕获。
          reboot_src_path = 'kernel/reboot.c'
          if os.path.exists(reboot_src_path):
              _rb = read(reboot_src_path)
              _m = re.search(
                  r'SYSCALL_DEFINE4\s*\(\s*reboot\s*,\s*int\s*,\s*magic1\s*,\s*int\s*,\s*magic2\s*,'
                  r'\s*unsigned\s+int\s*,\s*cmd\s*,\s*void\s+__user\s*\*\s*,\s*(\w+)\s*\)',
                  _rb, re.MULTILINE)
              reboot_arg = _m.group(1) if _m else 'arg'
              print('[INFO] reboot 第四参数名检测为: %s' % reboot_arg)
              inject_block(
                  reboot_src_path,
                  'ksu_handle_sys_reboot',
                  r'(SYSCALL_DEFINE4\s*\(\s*reboot\s*,[^)]*\)\s*\{)',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n'
                  '#endif\n\n',
                  '\n#ifdef CONFIG_KSU\n'
                  '\tksu_handle_sys_reboot(magic1, magic2, cmd, &%s);\n' % reboot_arg +
                  '#endif\n',
                  'SYSCALL_DEFINE4(reboot')
          else:
              print('[FAIL] 文件不存在: kernel/reboot.c')
              FAIL += 1

          print('=== Hook 注入结果: OK=%d SKIP=%d FAIL=%d ===' % (OK, SKIP, FAIL))
          sys.exit(1 if FAIL else 0)
          PYEOF
          python3 /tmp/ksu_patch.py

      # ----------------------------------------------------------------------
      # 6.5 修复 OPLUS 源码树的已知障碍
      #
      #     障碍 A: scripts/gcc-wrapper.py 是 Python 2 脚本
      #             print "..." 这种语句在 Python 3 下必然 SyntaxError。
      #             Ubuntu 22.04 runner 只有 Python 3, 于是 defconfig 阶段就崩:
      #               File "scripts/gcc-wrapper.py", line 29
      #                 def ... : SyntaxError: invalid syntax
      #             解法: 直接改名让 kbuild 用不到它 (4.19 不依赖它做编译)
      #
      #     障碍 B: init/Kconfig 里 source "kernel/sched_assist/Kconfig" 等路径
      #             在浅克隆 (--depth=1) 或子模块缺失时不存在, 导致:
      #               init/Kconfig:772: can't open file "kernel/sched_assist/Kconfig"
      #             解法: 为缺失的 Kconfig 生成占位文件
      # ----------------------------------------------------------------------
      - name: 6.5 修复 OPLUS 源码树障碍 (Python2 wrapper / 缺失 Kconfig)
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          set -ux
          RC=0

          # ---------------- 障碍 A: gcc-wrapper.py ----------------
          if [ "${{ inputs.disable_gcc_wrapper }}" = "true" ]; then
            for w in scripts/gcc-wrapper.py scripts/gcc-wrapper2.py scripts/ld-wrapper.py; do
              [ -f "$w" ] || continue
              echo ">>> 处理 Python2 遗留 wrapper: $w"

              # 先做内容级 Py2 -> Py3 转换 (print 语句 / except 语法 / xrange)
              python3 - "$w" <<'PYFIX' || true
          import re, sys, io

          path = sys.argv[1]
          with io.open(path, 'r', encoding='utf-8', errors='ignore') as f:
              src = f.read()

          orig = src

          # 1) print "xxx"  /  print "xxx", var   ->  print("xxx", var)
          def fix_print(m):
              indent, rest = m.group(1), m.group(2).rstrip()
              if rest.startswith('('):
                  return m.group(0)          # 已经是函数调用
              if rest.startswith('>>'):
                  # print >>sys.stderr, "msg"
                  mm = re.match(r'>>\s*([^,]+)\s*,\s*(.*)$', rest)
                  if mm:
                      return '%sprint(%s, file=%s)' % (indent, mm.group(2), mm.group(1).strip())
                  return m.group(0)
              # 顶层逗号分隔的多个表达式 -> 元组传参
              return '%sprint(%s)' % (indent, rest)

          src = re.sub(r'(?m)^([ \t]*)print\s+(.+)$', fix_print, src)

          # 2) except X, e:  ->  except X as e:
          src = re.sub(r'(?m)^([ \t]*)except\s+([^:\n]+?)\s*,\s*(\w+)\s*:',
                       r'\1except \2 as \3:', src)

          # 3) xrange -> range
          src = re.sub(r'\bxrange\b', 'range', src)

          # 4) 移除仅为 py2 存在的编码声明冲突 (保留 utf-8)
          src = re.sub(r'#!.*python2', '#!/usr/bin/env python3', src)

          if src != orig:
              with io.open(path, 'w', encoding='utf-8') as f:
                  f.write(src)
              print('    [Py3-Fixed] 已转换 Python2 语法')
          else:
              print('    [Py3-Fixed] 无需转换')
          PYFIX

              # 验证转换结果能否被 Python3 解析
              if python3 -c "import ast,io,sys; ast.parse(io.open(sys.argv[1],encoding='utf-8',errors='ignore').read())" "$w" 2>/dev/null; then
                echo "    [OK] $w 现在可被 Python3 解析"
              else
                echo "    [WARN] $w 仍无法被 Python3 解析, 改为禁用 (.disabled)"
                mv "$w" "$w.disabled"
              fi
            done

            # 给 py2-only wrapper 提供 python2 兜底 (某些树 Makefile 硬引用)
            if ! command -v python2 >/dev/null 2>&1; then
              mkdir -p "$HOME/.local/bin"
              cat > "$HOME/.local/bin/python2" <<'SHIM'
          #!/bin/sh
          exec python3 "$@"
          SHIM
              chmod +x "$HOME/.local/bin/python2"
              export PATH="$HOME/.local/bin:$PATH"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              echo ">>> 已放置 python2 -> python3 shim (兜底)"
            fi
          fi

          # ---------------- 障碍 B: 缺失的 Kconfig ----------------
          echo ">>> 扫描 init/Kconfig 中的 source 引用..."
          MISSING=0
          while read -r kc; do
            [ -z "$kc" ] && continue
            if [ ! -f "$kc" ]; then
              echo "  [缺失] $kc -> 生成占位 Kconfig"
              d=$(dirname "$kc")
              mkdir -p "$d"
              {
                echo "# 自动生成的占位 Kconfig (原始文件在源码树中缺失)"
                echo "# 来源: 由 CI 脚本补齐, 以避免 kbuild 因 source 失败而中断"
                echo ""
                echo "# 保持文件非空, 且不含任何 config 项"
              } > "$kc"
              MISSING=$((MISSING+1))
            fi
          done < <(grep -oE 'source[[:space:]]+"[^"]+"' init/Kconfig 2>/dev/null \
                   | sed -E 's/^source[[:space:]]+"([^"]+)"$/\1/' \
                   | grep -v '^\.\./' || true)

          echo ">>> init/Kconfig 补齐缺失文件数: $MISSING"

          # ---------------- 障碍 B2: 递归扫其它顶层 Kconfig ----------------
          echo ">>> 递归扫描 Kconfig 缺失引用..."
          MISSING2=0
          for topkc in Kconfig arch/arm64/Kconfig init/Kconfig kernel/Kconfig drivers/Kconfig fs/Kconfig; do
            [ -f "$topkc" ] || continue
            bd=$(dirname "$topkc")
            while read -r kc; do
              [ -z "$kc" ] && continue
              case "$kc" in ../*|/*) continue ;; esac
              full="$bd/$kc"
              if [ ! -f "$full" ]; then
                mkdir -p "$(dirname "$full")"
                {
                  echo "# 自动生成的占位 Kconfig"
                  echo ""
                } > "$full"
                MISSING2=$((MISSING2+1))
              fi
            done < <(grep -oE 'source[[:space:]]+"[^"]+"' "$topkc" 2>/dev/null \
                     | sed -E 's/^source[[:space:]]+"([^"]+)"$/\1/' || true)
          done
          echo ">>> 递归补齐数: $MISSING2"

          # ---------------- 障碍 C: 校验 gcc-version.sh 可执行 ----------------
          if [ -f scripts/gcc-version.sh ] && [ ! -x scripts/gcc-version.sh ]; then
            echo ">>> 修复 scripts/gcc-version.sh 执行位"
            chmod +x scripts/gcc-version.sh
          fi

          # ---------------- 障碍 D: python2 兜底 ----------------
          if command -v python2 >/dev/null 2>&1; then
            echo ">>> python2 可用: $(python2 --version 2>&1)"
          else
            echo ">>> python2 不可用 (已通过禁用 wrapper 规避)"
          fi

          echo ">>> 6.5 完成, 继续流程"
          exit $RC

      # ----------------------------------------------------------------------
      # 7. defconfig 定位与 KernelSU 配置写入
      # ----------------------------------------------------------------------
      - name: 7.1 定位 kona defconfig
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          set -eux
          echo ">>> arch/arm64/configs 实际内容:"
          find arch/arm64/configs -type f | sort

          if [ -n "${{ inputs.defconfig_override }}" ]; then
            DEFCFG="${{ inputs.defconfig_override }}"
          else
            DEFCFG=""
            for cand in \
              "arch/arm64/configs/vendor/kona-perf_defconfig" \
              "arch/arm64/configs/vendor/kona_defconfig" \
              "arch/arm64/configs/kona-perf_defconfig" \
              "arch/arm64/configs/kona_defconfig" \
              "arch/arm64/configs/vendor/oplus_kona_defconfig" \
              "arch/arm64/configs/vendor/oplus_defconfig"; do
              if [ -f "$cand" ]; then DEFCFG="$cand"; break; fi
            done
            # 兜底 1: 任意含 rmx3370 的 defconfig (某些 OPLUS 树用机型名)
            if [ -z "$DEFCFG" ]; then
              DEFCFG=$(find arch/arm64/configs -type f -name '*rmx3370*' | head -n1 || true)
            fi
            # 兜底 2: 任意含 kona 的 perf defconfig
            if [ -z "$DEFCFG" ]; then
              DEFCFG=$(find arch/arm64/configs -type f -name '*kona*perf*' | head -n1 || true)
            fi
            # 兜底 3: 任意含 kona 的 defconfig
            if [ -z "$DEFCFG" ]; then
              DEFCFG=$(find arch/arm64/configs -type f -name '*kona*' | head -n1 || true)
            fi
          fi

          if [ -z "$DEFCFG" ] || [ ! -f "$DEFCFG" ]; then
            echo "::error:: 未能定位 defconfig。以下是 arch/arm64/configs 下全部文件:"
            find arch/arm64/configs -type f | sort
            echo "::error:: 请把 defconfig_override 设为上面列表中的相对路径 (例如 vendor/kona-perf_defconfig)"
            exit 1
          fi
          echo ">>> 锁定 DEFCONFIG: $DEFCFG"
          echo "DEFCFG=$DEFCFG" >> "$GITHUB_ENV"
          # 传给 make 的相对 path (相对 arch/arm64/configs)
          DEFCFG_REL="${DEFCFG#arch/arm64/configs/}"
          echo ">>> 传给 make 的目标: $DEFCFG_REL"
          echo "DEFCFG_REL=$DEFCFG_REL" >> "$GITHUB_ENV"

      - name: 7.2 写入 KernelSU 配置项
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          set -eux
          F="$DEFCFG"
          test -f "$F" || { echo "::error:: defconfig 不存在: $F"; exit 1; }

          add_kv() {
            # $1=key  $2=value  幂等追加 (先删除同名行再追加)
            sed -i -E "/^[[:space:]]*#?[[:space:]]*${1}[[:space:]]*[=)].*$/d" "$F" 2>/dev/null || true
            echo "${1}=${2}" >> "$F"
          }

          add_kv CONFIG_KSU y
          add_kv CONFIG_OVERLAY_FS y
          add_kv CONFIG_KSU_MANUAL_HOOK y

          if [ "${{ inputs.hook_mode }}" = "kprobe" ]; then
            add_kv CONFIG_KPROBES y
            add_kv CONFIG_HAVE_KPROBES y
            add_kv CONFIG_KPROBE_EVENTS y
            add_kv CONFIG_KSU_KPROBE_HOOKS y
          else
            # manual 模式: 必须显式关闭 kprobe, 否则 4.19 kona 易卡开机
            sed -i -E '/^CONFIG_KPROBES[[:space:]]*=/d' "$F" 2>/dev/null || true
            sed -i -E '/^CONFIG_KSU_KPROBE_HOOKS[[:space:]]*=/d' "$F" 2>/dev/null || true
            printf '# CONFIG_KPROBES is not set\n# CONFIG_KSU_KPROBE_HOOKS is not set\n' >> "$F"
          fi

          echo ">>> 追加后的 KernelSU 相关配置:"
          grep -n 'CONFIG_KSU\|CONFIG_OVERLAY_FS\|CONFIG_KPROBE' "$F" || true

      # ----------------------------------------------------------------------
      # 8. 编译内核
      # ----------------------------------------------------------------------
      - name: 8.0 编译前环境净化与预检
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          set -ux

          echo "================= defconfig 目标预检 ================="
          echo "DEFCFG     = ${DEFCFG:-<未设置>}"
          echo "DEFCFG_REL = ${DEFCFG_REL:-<未设置>}"
          if [ -n "${DEFCFG:-}" ] && [ -f "$DEFCFG" ]; then
            echo "defconfig 文件存在, 行数 = $(wc -l < "$DEFCFG")"
          else
            echo "::error:: defconfig 文件不存在: ${DEFCFG:-未设置}"
            exit 1
          fi

          echo ""
          echo "================= Kconfig source 完整性 ================="
          MISSING=0
          for topkc in Kconfig arch/arm64/Kconfig init/Kconfig kernel/Kconfig drivers/Kconfig fs/Kconfig mm/Kconfig net/Kconfig; do
            [ -f "$topkc" ] || continue
            bd=$(dirname "$topkc")
            while read -r kc; do
              [ -z "$kc" ] && continue
              case "$kc" in ../*|/*) continue ;; esac
              if [ ! -f "$bd/$kc" ]; then
                echo "  [缺失] $topkc -> $kc"
                MISSING=$((MISSING+1))
                mkdir -p "$(dirname "$bd/$kc")"
                printf '# 自动生成占位 Kconfig\n\n' > "$bd/$kc"
              fi
            done < <(grep -oE 'source[[:space:]]+"[^"]+"' "$topkc" 2>/dev/null | sed -E 's/^source[[:space:]]+"([^"]+)"$/\1/' || true)
          done
          echo "补齐缺失 Kconfig: $MISSING 个"

          echo ""
          echo "================= Python / 主机工具预检 ================="
          echo "python3 : $(command -v python3 || echo '<无>')"
          python3 --version 2>&1 || true
          echo "python  : $(command -v python || echo '<无>')"
          echo "python2 : $(command -v python2 || echo '<无, 已由 6.5 步规避>')"
          # kbuild 有时调用 `python` (py2 习惯), 指向 python3 避免 "command not found"
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(command -v python3)" "$HOME/.local/bin/python" 2>/dev/null || true
            export PATH="$HOME/.local/bin:$PATH"
            echo ">>> 已创建 python -> python3 软链"
          fi

          echo ""
          echo "================= 遗留 wrapper 状态 ================="
          ls -la scripts/gcc-wrapper.py* scripts/ld-wrapper.py* 2>/dev/null || echo "  <无遗留 wrapper 或已改名>"
          grep -rn 'gcc-wrapper' scripts/Makefile* Makefile 2>/dev/null | head -10 || true

          echo ""
          echo "================= 工具链可执行性 ================="
          for t in "${CLANG_DIR}/bin/clang" "${GCC64_DIR}/bin/aarch64-unknown-linux-gnu-gcc" "${GCC32_DIR}/bin/arm-unknown-linux-gnueabi-gcc"; do
            if [ -x "$t" ]; then echo "  [OK]   $t"; else echo "  [MISS] $t"; fi
          done

          echo ">>> 8.0 预检完成"

      - name: 8.1 生成 .config
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          set -eux
          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-unknown-linux-gnu-"
          export CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-unknown-linux-gnueabi-"
          export HOSTCC=clang
          export HOSTCXX=clang++

          if [ "${{ inputs.use_ccache }}" = "true" ]; then
            ccache --max-size=5G || true
            ccache -z || true
            export CC="ccache clang"
          fi

          clang --version

          echo ">>> 即将执行: make O=out ARCH=arm64 ... $DEFCFG_REL"
          set +e
          make O=out ARCH=arm64 \
            CC="$CC" \
            HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip READELF=llvm-readelf \
            "$DEFCFG_REL" > defconfig.log 2>&1
          RC=$?
          set -e

          echo "===== defconfig.log ====="
          cat defconfig.log || true

          if [ "$RC" -ne 0 ]; then
            echo "::error:: defconfig 失败 (退出码 $RC), 目标=$DEFCFG_REL"
            echo "===== 错误摘要 ====="
            grep -nE 'error|Error|syntax|can.t open|No such file|not found|\*\*\*' defconfig.log | head -80 || true
            exit "$RC"
          fi

          test -f out/.config || { echo "::error:: out/.config 未生成"; exit 1; }
          echo ">>> 关键配置:"
          grep -E 'CONFIG_KSU|CONFIG_KPROBE|CONFIG_OVERLAY_FS' out/.config || true

      - name: 8.2 编译 Image
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          set -eux
          export PATH="${CLANG_DIR}/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="KSU"
          export KBUILD_BUILD_HOST="RMX3370"
          export KBUILD_BUILD_VERSION="1"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-unknown-linux-gnu-"
          export CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-unknown-linux-gnueabi-"
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export STRIP=llvm-strip READELF=llvm-readelf

          if [ "${{ inputs.use_ccache }}" = "true" ]; then
            export CC="ccache clang"
          fi

          # 关键: 不能把 make 的输出管进 tail —— 管道退出码取 tail, 会吞掉 make 失败。
          # 改为落盘日志 + PIPESTATUS 判定。
          set +e
          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip READELF=llvm-readelf \
            KCFLAGS="-Wno-error" > build.log 2>&1
          MAKE_RC=$?
          set -e

          echo "===== build.log 末尾 120 行 ====="
          tail -120 build.log || true

          if [ "$MAKE_RC" -ne 0 ]; then
            echo "::error:: make 失败, 退出码 $MAKE_RC"
            echo "===== 错误摘要 ====="
            grep -nE 'error:|Error [0-9]+|fatal error|\*\*\*' build.log | head -60 || true
            exit "$MAKE_RC"
          fi

          echo "===== 编译产物 ====="
          ls -lh out/arch/arm64/boot/ || true
          test -f out/arch/arm64/boot/Image || { echo "::error:: 未生成 out/arch/arm64/boot/Image"; ls -la out/arch/arm64/boot/ 2>/dev/null || true; exit 1; }
          echo "::notice:: 内核 Image 编译成功"

      # ----------------------------------------------------------------------
      # 9. 打包
      # ----------------------------------------------------------------------
      - name: 9.1 打包 AnyKernel3
        working-directory: ${{ github.workspace }}/oplus/kernel/msm-4.19
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/oplus/kernel/msm-4.19"
          BOOT="$SRC/out/arch/arm64/boot"

          if [ ! -f "$BOOT/Image" ]; then
            echo "::error:: 未生成 $BOOT/Image, 编译失败"
            ls -la "$BOOT" 2>/dev/null || true
            exit 1
          fi

          AK3="$GITHUB_WORKSPACE/AnyKernel3"
          rm -rf "$AK3"
          ok=0
          for attempt in 1 2 3; do
            echo ">>> AnyKernel3 克隆尝试 $attempt/3"
            if git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3"; then ok=1; break; fi
            rm -rf "$AK3"; sleep 8
          done
          [ "$ok" -eq 1 ] || { echo "::error:: AnyKernel3 克隆失败"; exit 1; }
          rm -rf "$AK3/.git"
          cd "$AK3"

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=KernelSU Built-in Kernel for realme GT Neo2 (RMX3370 / RE5473)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          '; }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cp "$BOOT/Image" ./
          for extra in dtbo.img dtb.img; do
            [ -f "$BOOT/$extra" ] && cp "$BOOT/$extra" ./ || true
          done
          ls -lh ./

          REL="$GITHUB_WORKSPACE/release_out"
          mkdir -p "$REL"
          cp "$BOOT/Image" "$REL/Image"

          PKG="AnyKernel3-RMX3370-RealmeUI4-KSU-${{ inputs.ksu_variant }}-${{ inputs.hook_mode }}.zip"
          rm -f "$REL/$PKG"
          zip -r9 "$REL/$PKG" . -x '.git/*' 'README.md' '*placeholder'

          # 校验产物真实存在且非空
          test -s "$REL/Image" || { echo "::error:: Image 为空"; exit 1; }
          test -s "$REL/$PKG" || { echo "::error:: zip 为空"; exit 1; }

          echo "===== 最终产物 ====="
          ls -lh "$REL/"
          echo "sha256:"
          sha256sum "$REL"/* || true

      # ----------------------------------------------------------------------
      # 9.5 诊断归档 —— always() 保证成功或失败都会执行
      #     把编译日志、配置、版本、工具链信息打包成 artifact, 免去翻网页日志
      # ----------------------------------------------------------------------
      - name: 9.5 归档诊断信息 (成功失败都执行)
        if: always()
        run: |
          set +e
          DIAG="$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$DIAG"
          SRC="$GITHUB_WORKSPACE/oplus/kernel/msm-4.19"

          {
            echo
            echo "================= 构建环境 ================="
            echo "run_id      : ${GITHUB_RUN_ID}"
            echo "run_number  : ${GITHUB_RUN_NUMBER}"
            echo "job         : ${GITHUB_JOB}"
            echo "runner      : ${RUNNER_OS} ${RUNNER_ARCH}"
            echo "workspace   : ${GITHUB_WORKSPACE}"
            echo "结束时间    : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "job_status  : ${{ job.status }}"
            echo
            echo "================= 工具链 ================="
            echo "CLANG_DIR : ${CLANG_DIR:-<未设置>}"
            echo "GCC64_DIR : ${GCC64_DIR:-<未设置>}"
            echo "GCC32_DIR : ${GCC32_DIR:-<未设置>}"
            echo "SRC_DIR   : ${SRC_DIR:-<未设置>}"
            if [ -n "${CLANG_DIR:-}" ] && [ -x "${CLANG_DIR}/bin/clang" ]; then
              "${CLANG_DIR}/bin/clang" --version
            fi
            if [ -n "${GCC64_DIR:-}" ] && [ -x "${GCC64_DIR}/bin/aarch64-unknown-linux-gnu-gcc" ]; then
              "${GCC64_DIR}/bin/aarch64-unknown-linux-gnu-gcc" --version | head -1
            fi
            echo
            echo "================= 内核源码 ================="
            if [ -d "$SRC/.git" ]; then
              git -C "$SRC" log -1 --oneline
              git -C "$SRC" rev-parse HEAD
            fi
            echo "内核版本号:"
            head -5 "$SRC/Makefile" 2>/dev/null
            echo
            echo "================= KernelSU 集成 ================="
            if [ -d "$SRC/KernelSU" ]; then
              echo ">>> KernelSU 顶层内容:"
              ls -la "$SRC/KernelSU/" 2>&1 | head -30
              echo ">>> KernelSU/kernel 文件:"
              find "$SRC/KernelSU" -maxdepth 2 -type f 2>/dev/null | head -40
              if [ -f "$SRC/KernelSU/kernel/Makefile" ]; then
                echo ">>> KernelSU/kernel/Makefile:"
                cat "$SRC/KernelSU/kernel/Makefile"
              fi
              # 版本信息
              for vf in "$SRC/KernelSU/kernel/version.h" "$SRC/KernelSU/kernel/Kconfig"; do
                [ -f "$vf" ] && { echo ">>> $vf:"; cat "$vf"; }
              done
            else
              echo "<KernelSU 目录不存在>"
            fi
            echo
            echo "================= Hook 注入校验 ================="
            _hook_found=0
            for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c; do
              echo "--- $f ---"
              if [ -f "$SRC/$f" ]; then
                if grep -n 'CONFIG_KSU\|ksu_handle' "$SRC/$f" 2>/dev/null; then
                  _hook_found=$((_hook_found+1))
                else
                  echo "  <无 KernelSU 痕迹>"
                fi
              else
                echo "  <文件不存在>"
              fi
            done
            echo "已注入 hook 的文件数: ${_hook_found}/5 (manual 模式下预期 5)"
            echo
            echo "================= defconfig ================="
            echo "DEFCFG     : ${DEFCFG:-<未设置>}"
            echo "DEFCFG_REL : ${DEFCFG_REL:-<未设置>}"
            if [ -n "${DEFCFG:-}" ] && [ -f "$SRC/$DEFCFG" ]; then
              grep -n 'CONFIG_KSU\|CONFIG_KPROBE\|CONFIG_OVERLAY_FS' "$SRC/$DEFCFG" || true
            else
              echo "<defconfig 文件未找到: $SRC/${DEFCFG:-未设置}>"
            fi
            echo
            echo "================= out/.config 关键项 ================="
            if [ -f "$SRC/out/.config" ]; then
              grep -E 'CONFIG_KSU|CONFIG_KPROBE|CONFIG_OVERLAY_FS' "$SRC/out/.config" || true
            else
              echo "<out/.config 不存在>"
            fi
          } >> "$DIAG/summary.txt" 2>&1

          # 编译日志 (完整, 不截断)
          [ -f "$SRC/build.log" ] && cp "$SRC/build.log" "$DIAG/build.log" || echo "<无 build.log>" > "$DIAG/build.log"
          # 错误摘要
          [ -f "$SRC/build.log" ] && grep -nE 'error:|Error [0-9]+|fatal error|\*\*\*|undefined reference|No rule to make' "$SRC/build.log" | head -200 > "$DIAG/errors.txt" 2>&1 || true
          # 内核配置
          [ -f "$SRC/out/.config" ] && cp "$SRC/out/.config" "$DIAG/dotconfig.txt" || true
          # 产物清单
          ls -laR "$GITHUB_WORKSPACE/release_out" > "$DIAG/artifacts.txt" 2>&1 || true
          # 源码树结构
          find "$SRC" -maxdepth 2 -type d > "$DIAG/srctree.txt" 2>&1 || true

          echo "===== 诊断包内容 ====="
          ls -lh "$DIAG/"

      - name: 9.6 上传诊断包 (成功失败都执行)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIAGNOSTICS-${{ github.run_number }}-${{ inputs.ksu_variant }}-${{ inputs.hook_mode }}
          path: ${{ github.workspace }}/diagnostics/*
          retention-days: 14
          if-no-files-found: warn

      - name: 9.2 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RMX3370-RealmeUI4-KernelSU-${{ inputs.ksu_variant }}-${{ inputs.hook_mode }}
          path: ${{ github.workspace }}/release_out/*
          retention-days: 30
