name: RMX3370 F.21 Kernel Build (4.19.157-perf+)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_stage:
        description: '构建阶段: stage1(纯Stock基线) / stage2(KSU-Next kprobe) / stage3(KSU-Next 手动Hook)'
        required: true
        default: 'stage2_ksu_kprobe'
        type: choice
        options:
          - 'stage1_stock_baseline'
          - 'stage2_ksu_kprobe'
          - 'stage3_ksu_manual'
      ksu_next_ref:
        description: '固定 KernelSU-Next 分支或 Tag (用于 stage2/stage3)'
        required: true
        default: 'legacy'
        type: string
      kernel_commit:
        description: '固定官方内核源码 Commit SHA (默认 HEAD)'
        required: false
        default: 'HEAD'
        type: string

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: "0. 检出当前仓库文件 (RMX3370_F21_config.gz / 公钥证书 / 原厂 boot)"
        uses: actions/checkout@v4

      - name: "1. 安装编译依赖环境 (含 gawk / dtc / pkg-config)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler \
            dwarves flex g++-multilib gawk gcc-multilib git gnupg gperf gzip \
            imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop openssl pahole pkg-config \
            pngcrush python-is-python3 python2 python3 rsync schedtool \
            squashfs-tools unzip xsltproc zip zlib1g-dev

      - name: "2. 拉取官方 Android T 内核源码并固定 Commit"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/oplus_src/kernel"
          git clone --depth=50 \
            https://github.com/realme-kernel-opensource/realme_GTneo2-Q5pro-GTMasterExploratory-AndroidT-kernel-source.git \
            "$GITHUB_WORKSPACE/oplus_src/kernel/msm-4.19"

          cd "$GITHUB_WORKSPACE/oplus_src/kernel/msm-4.19"
          COMMIT_REF="${{ inputs.kernel_commit || 'HEAD' }}"
          if [ "$COMMIT_REF" != "HEAD" ]; then
            git fetch --depth=1 origin "$COMMIT_REF" || true
            git checkout "$COMMIT_REF"
          fi
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" | tee "$GITHUB_WORKSPACE/kernel_commit.txt"

          ln -sfn "$GITHUB_WORKSPACE/oplus_src/kernel" "$GITHUB_WORKSPACE/kernel" || true
          ln -sfn "$GITHUB_WORKSPACE/oplus_src/kernel/msm-4.19" "$GITHUB_WORKSPACE/oplus_src/kernel/msm-5.4" || true

      - name: "3. 下载匹配 /proc/version 的 AOSP Clang 10.0.7 (r377782d) 与 GCC 4.9 (binutils 2.27)"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchains/clang"
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r377782d.tar.gz" \
            | tar -xz -C "$GITHUB_WORKSPACE/toolchains/clang" || {
              echo ">>> 回退拉取 Proton-Clang..."
              rm -rf "$GITHUB_WORKSPACE/toolchains/clang"
              git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/toolchains/clang"
            }

          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git "$GITHUB_WORKSPACE/toolchains/gcc64"
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git "$GITHUB_WORKSPACE/toolchains/gcc32"

          "$GITHUB_WORKSPACE/toolchains/clang/bin/clang" --version
          "$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-ld" --version

      - name: "4. 清理全仓 Windows 文本假软链接、补齐 sched_assist 等头文件与 Kconfig (不修改 kernel/module.c)"
        working-directory: ${{ github.workspace }}/oplus_src/kernel/msm-4.19
        run: |
          python3 - << 'EOF'
          import os, re, shutil, traceback

          root = os.getcwd()

          def safe_makedirs(d):
              # 创建目录前自动移除路径上任何阻挡目录创建的损坏软链接或 Windows 文本假软链接文件
              rel = os.path.relpath(d, root)
              if rel == "." or rel.startswith(".."):
                  os.makedirs(d, exist_ok=True)
                  return
              cur = root
              for part in rel.split(os.sep):
                  if not part or part == ".":
                      continue
                  cur = os.path.join(cur, part)
                  if os.path.islink(cur) and not os.path.exists(cur):
                      print(f"[SafeMakedirs] 移除损坏软链接: {os.path.relpath(cur, root)}")
                      os.unlink(cur)
                  elif os.path.exists(cur) and not os.path.isdir(cur):
                      print(f"[SafeMakedirs] 移除阻挡目录创建的非目录文件(假软链接): {os.path.relpath(cur, root)}")
                      os.unlink(cur)
              os.makedirs(d, exist_ok=True)

          # 1. 将 scripts/gcc-wrapper.py 替换为直接透传脚本
          gw_path = os.path.join(root, "scripts/gcc-wrapper.py")
          if os.path.exists(gw_path) or os.path.islink(gw_path):
              if os.path.islink(gw_path):
                  os.unlink(gw_path)
              with open(gw_path, "w", encoding="utf-8") as f:
                  f.write("#!/usr/bin/env python3\nimport os, sys\nos.execvp(sys.argv[1], sys.argv[1:])\n")
              os.chmod(gw_path, 0o755)
              print("[Fix 1] 已替换 scripts/gcc-wrapper.py 为直接透传脚本。")

          # 2. 全仓扫描并清理被提交为普通单行文本文件的“Windows 假软链接” (涵盖 include/, kernel/, drivers/, arch/ 等所有目录)
          text_symlinks = []
          for dirpath, _, filenames in os.walk(root):
              if ".git" in dirpath:
                  continue
              for fn in filenames:
                  fpath = os.path.join(dirpath, fn)
                  if not os.path.islink(fpath) and os.path.isfile(fpath):
                      sz = os.path.getsize(fpath)
                      if 0 < sz < 260 and fn not in ("Makefile", "Kconfig", "Kbuild", "README", "LICENSE", ".gitignore", "localversion"):
                          try:
                              with open(fpath, "rb") as bf:
                                  raw = bf.read()
                              if b"\x00" not in raw:
                                  txt = raw.decode("utf-8", errors="ignore").strip()
                                  # 单行相对路径特征：不包含空格、分号、等号、井号、括号，且包含 ../ 或 /
                                  if "\n" not in txt and ("../" in txt or "/" in txt) and not any(c in txt for c in (" ", ";", "=", "#", "(", ")", "{", "}", "<", ">", '"')):
                                      text_symlinks.append((fpath, txt))
                          except Exception:
                              pass

          for fpath, target_txt in text_symlinks:
              rel_f = os.path.relpath(fpath, root)
              resolved = os.path.normpath(os.path.join(os.path.dirname(fpath), target_txt))
              os.unlink(fpath)
              if os.path.exists(resolved):
                  os.symlink(resolved, fpath)
                  print(f"[Text Symlink Restored] {rel_f} -> {os.path.relpath(resolved, root)}")
              else:
                  print(f"[Broken Text Symlink Removed] 已删除指向不存在路径的假软链接文件: {rel_f} (原内容: {target_txt})")

          # 3. 索引全仓真实存在的所有目录和文件
          real_dirs = {}
          real_files = {}
          for dirpath, dirnames, filenames in os.walk(root):
              if ".git" in dirpath:
                  continue
              for d in dirnames:
                  full_d = os.path.join(dirpath, d)
                  if not os.path.islink(full_d) and os.path.isdir(full_d):
                      real_dirs.setdefault(d, []).append(full_d)
              for fn in filenames:
                  full_f = os.path.join(dirpath, fn)
                  if not os.path.islink(full_f) and os.path.isfile(full_f):
                      real_files.setdefault(fn, []).append(full_f)

          print(f"[Index] 已索引真实目录 {len(real_dirs)} 个，真实文件 {len(real_files)} 个 (sched_assist_mutex.h 是否在仓内: {'sched_assist_mutex.h' in real_files})。")

          # 4. 补齐 wakelock_profiler.h
          if "wakelock_profiler_qcom.h" in real_files:
              for src_h in real_files["wakelock_profiler_qcom.h"]:
                  dst_h = os.path.join(os.path.dirname(src_h), "wakelock_profiler.h")
                  if os.path.islink(dst_h):
                      os.unlink(dst_h)
                  if not os.path.exists(dst_h):
                      shutil.copyfile(src_h, dst_h)
                      real_files.setdefault("wakelock_profiler.h", []).append(dst_h)

          # 5. 处理全仓损坏的 Unix 软链接
          for dirpath, dirnames, filenames in os.walk(root):
              if ".git" in dirpath:
                  continue
              for name in list(dirnames) + list(filenames):
                  full_p = os.path.join(dirpath, name)
                  if os.path.islink(full_p) and not os.path.exists(full_p):
                      raw_target = os.readlink(full_p)
                      base_target = os.path.basename(raw_target.rstrip("/"))
                      os.unlink(full_p)
                      if name in real_files:
                          shutil.copyfile(real_files[name][0], full_p)
                          print(f"[Unix File Link Restored] {os.path.relpath(full_p, root)} <= {os.path.relpath(real_files[name][0], root)}")
                      elif base_target in real_files:
                          shutil.copyfile(real_files[base_target][0], full_p)
                          print(f"[Unix File Link Restored] {os.path.relpath(full_p, root)} <= {os.path.relpath(real_files[base_target][0], root)}")
                      else:
                          cands = [d for d in (real_dirs.get(name) or real_dirs.get(base_target) or []) if os.path.exists(d)]
                          if len(cands) >= 1 and base_target not in ("include", "kernel", "drivers", "common", "core"):
                              os.symlink(cands[0], full_p)
                              print(f"[Unix Dir Link Restored] {os.path.relpath(full_p, root)} -> {os.path.relpath(cands[0], root)}")
                          elif not os.path.splitext(name)[1] and not full_p.startswith(os.path.join(root, "include")):
                              safe_makedirs(full_p)
                              with open(os.path.join(full_p, "Kconfig"), "w") as kf:
                                  kf.write(f"# Stub Kconfig for {name}\n")
                              with open(os.path.join(full_p, "Makefile"), "w") as mf:
                                  mf.write(f"# Stub Makefile for {name}\n")
                              print(f"[Unix Dir Link Stubbed] {os.path.relpath(full_p, root)}")

          # 6. 全仓扫描所有 .c / .h 中的 #include <...> 引用，使用 safe_makedirs 补齐缺失头文件或复制同目录全部头文件
          include_dirs = [
              os.path.join(root, "include"),
              os.path.join(root, "arch/arm64/include"),
              os.path.join(root, "arch/arm64/include/uapi"),
              os.path.join(root, "include/uapi"),
              root,
          ]
          inc_re = re.compile(r'^\s*#\s*include\s+<([^>]+)>', re.MULTILINE)
          macro_guard_re = re.compile(r'(OPLUS_FEATURE_[A-Z0-9_]+|CONFIG_OPLUS_[A-Z0-9_]+)')
          missing_headers = set()
          broken_oplus_macros = set()
          resolved_headers = 0

          for dirpath, _, filenames in os.walk(root):
              if ".git" in dirpath or "Documentation" in dirpath or "scripts" in dirpath:
                  continue
              for fn in filenames:
                  if fn.endswith((".c", ".h")):
                      fpath = os.path.join(dirpath, fn)
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                          if "../../../kernel" in content:
                              content = re.sub(r'#include\s+["<](?:\.\./)+kernel/(?:msm-[0-9.]+/)?([^">]+)[">]', r'#include <\1>', content)
                              with open(fpath, "w", encoding="utf-8") as wf:
                                  wf.write(content)
                          for m in inc_re.finditer(content):
                              inc_rel = m.group(1).strip()
                              if "/" in inc_rel and any(k in inc_rel for k in ("sched_assist", "oplus", "wakelock", "special_opt", "ux_", "healthinfo", "hans", "im.h", "tpd", "Revert", "soc/oplus")):
                                  if not any(os.path.isfile(os.path.join(idir, inc_rel)) for idir in include_dirs):
                                      bname = os.path.basename(inc_rel)
                                      dst_f = os.path.join(root, "include", inc_rel)
                                      dst_dir = os.path.dirname(dst_f)
                                      safe_makedirs(dst_dir)
                                      if bname in real_files:
                                          src_file = real_files[bname][0]
                                          src_dir = os.path.dirname(src_file)
                                          # 将该头文件所在目录的所有 .h 一并复制到目标 include 子目录，防止连带头文件缺失
                                          for sfn in os.listdir(src_dir):
                                              if sfn.endswith(".h"):
                                                  sp = os.path.join(src_dir, sfn)
                                                  dp = os.path.join(dst_dir, sfn)
                                                  if os.path.isfile(sp) and not os.path.exists(dp):
                                                      shutil.copyfile(sp, dp)
                                                      resolved_headers += 1
                                          if not os.path.isfile(dst_f):
                                              shutil.copyfile(src_file, dst_f)
                                              resolved_headers += 1
                                          print(f"[Header Copied] 已将 {os.path.relpath(src_file, root)} (及同目录头文件) 复制到 include/{inc_rel}")
                                      else:
                                          missing_headers.add(inc_rel)
                                          start_pos = max(0, m.start() - 400)
                                          context_before = content[start_pos : m.start()]
                                          for gm in macro_guard_re.finditer(context_before):
                                              broken_oplus_macros.add(gm.group(1))
                      except Exception as e:
                          print(f"[ERROR] 处理头文件引用 {fpath} 异常: {e}")
                          traceback.print_exc()

          for inc_rel in sorted(missing_headers):
              dst_f = os.path.join(root, "include", inc_rel)
              safe_makedirs(os.path.dirname(dst_f))
              if not os.path.isfile(dst_f):
                  guard = "STUB_" + re.sub(r"[^A-Za-z0-9_]", "_", inc_rel.upper())
                  with open(dst_f, "w", encoding="utf-8") as hf:
                      hf.write(f"#ifndef {guard}\n#define {guard}\n/* Auto-generated stub for {inc_rel} */\n#endif\n")
                  print(f"[Header Stub Created] include/{inc_rel}")

          # 强制兜底检查 include/linux/sched_assist/sched_assist_mutex.h 必须存在且为可读文件
          sa_mutex_h = os.path.join(root, "include/linux/sched_assist/sched_assist_mutex.h")
          if not os.path.isfile(sa_mutex_h):
              safe_makedirs(os.path.dirname(sa_mutex_h))
              if "sched_assist_mutex.h" in real_files:
                  shutil.copyfile(real_files["sched_assist_mutex.h"][0], sa_mutex_h)
              else:
                  with open(sa_mutex_h, "w", encoding="utf-8") as hf:
                      hf.write("#ifndef _OPLUS_SCHED_ASSIST_MUTEX_H_\n#define _OPLUS_SCHED_ASSIST_MUTEX_H_\n#endif\n")
          print(f"[Verify] include/linux/sched_assist/sched_assist_mutex.h exists={os.path.isfile(sa_mutex_h)}, size={os.path.getsize(sa_mutex_h)}")

          # 7. 修复 OplusKernelEnvConfig.mk
          oplus_env = os.path.join(root, "OplusKernelEnvConfig.mk")
          if os.path.exists(oplus_env):
              with open(oplus_env, "r", encoding="utf-8", errors="ignore") as f:
                  env_content = f.read()
              env_content = re.sub(r'\$\(\s*NF\s*-\s*([0-9]+)\s*\)', r'(NF>\1?$(NF-\1):$1)', env_content)
              for macro in sorted(broken_oplus_macros):
                  if macro in env_content:
                      env_content = re.sub(r'\b' + re.escape(macro) + r'\b', 'DISABLED_UNSHIPPED_' + macro, env_content)
              with open(oplus_env, "w", encoding="utf-8") as f:
                  f.write(env_content)

          # 8. 多轮扫描全仓所有 Kconfig* 文件，清理 CRLF 并使用 safe_makedirs 补齐缺失的 Kconfig
          source_re = re.compile(r'^\s*source\s+"([^"]+)"', re.MULTILINE)
          for _pass in range(4):
              fixed_in_pass = 0
              for dirpath, _, filenames in os.walk(root):
                  if ".git" in dirpath:
                      continue
                  for fn in filenames:
                      if "Kconfig" in fn:
                          kpath = os.path.join(dirpath, fn)
                          try:
                              with open(kpath, "r", encoding="utf-8", errors="ignore") as f:
                                  kcontent = f.read()
                              if "\r" in kcontent:
                                  kcontent = kcontent.replace("\r\n", "\n").replace("\r", "\n")
                                  with open(kpath, "w", encoding="utf-8") as wf:
                                      wf.write(kcontent)
                              for m in source_re.finditer(kcontent):
                                  rel_target = m.group(1).strip()
                                  abs_target = os.path.join(root, rel_target)
                                  if not os.path.isfile(abs_target):
                                      target_dir = os.path.dirname(abs_target)
                                      safe_makedirs(target_dir)
                                      with open(abs_target, "w", encoding="utf-8") as kf:
                                          kf.write(f"# Auto-generated stub for missing {rel_target}\n")
                                      mk_stub = os.path.join(target_dir, "Makefile")
                                      if not os.path.exists(mk_stub):
                                          with open(mk_stub, "w", encoding="utf-8") as mf:
                                              mf.write("# Auto-generated stub Makefile\n")
                                      print(f"[Kconfig Stub] 已补齐缺失的 {rel_target}")
                                      fixed_in_pass += 1
                          except Exception as e:
                              print(f"[WARN] 扫描 {kpath} 异常: {e}")
              if fixed_in_pass == 0:
                  break

          # 9. 在顶层 Makefile 移除 Clang 10 不支持的 GCC 警告选项 (含 -Wno-undefined-optimized)，并清理子目录 -Werror
          makefile_path = os.path.join(root, "Makefile")
          with open(makefile_path, "r", encoding="utf-8", errors="ignore") as f:
              mk = f.read()
          mk = mk.replace("-Werror", "-Wno-error")
          for bad_flag in (
              "-Wno-undefined-optimized",
              "-Wno-psabi",
              "-Wno-frame-address",
              "-Wno-format-truncation",
              "-Wno-format-overflow",
              "-Wno-stringop-truncation",
              "-Wno-zero-length-bounds",
              "-Wno-stringop-overflow",
              "-Wno-restrict",
              "-Wno-maybe-uninitialized",
              "-Wno-packed-not-aligned",
              "-Wno-pointer-to-enum-cast",
          ):
              mk = mk.replace(bad_flag, "")
          mk += (
              "\n# OPLUS root include path & Clang 10 warning tolerance\n"
              "KBUILD_CFLAGS := -Wno-unknown-warning-option $(KBUILD_CFLAGS) -I$(srctree) -I$(srctree)/include -Wno-error "
              "-Wno-deprecated-declarations -Wno-format -Wno-enum-conversion -Wno-array-bounds\n"
              "HOSTCFLAGS += -Wno-deprecated-declarations\n"
          )
          with open(makefile_path, "w", encoding="utf-8") as f:
              f.write(mk)

          for dirpath, _, filenames in os.walk(root):
              if '.git' in dirpath:
                  continue
              for fn in filenames:
                  if fn in ('Makefile', 'Kbuild') or fn.endswith('.mk'):
                      fpath = os.path.join(dirpath, fn)
                      try:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                              c = f.read()
                          if '-Werror' in c or '-Wno-undefined-optimized' in c:
                              c2 = re.sub(r'(?<![a-zA-Z0-9_-])-Werror(?![=a-zA-Z0-9_-])', '-Wno-error', c)
                              c2 = c2.replace('-Wno-undefined-optimized', '')
                              if c2 != c:
                                  with open(fpath, 'w', encoding='utf-8') as f:
                                      f.write(c2)
                      except Exception:
                          pass
          EOF

      - name: "5. 按所选阶段集成 KernelSU-Next (不混用 kprobe 与手动 Hook)"
        working-directory: ${{ github.workspace }}/oplus_src/kernel/msm-4.19
        run: |
          STAGE="${{ inputs.build_stage || 'stage2_ksu_kprobe' }}"
          KSU_REF="${{ inputs.ksu_next_ref || 'legacy' }}"
          echo ">>> 当前构建阶段: $STAGE (KSU_REF=$KSU_REF)"

          if [ "$STAGE" = "stage1_stock_baseline" ]; then
            echo ">>> [Stage 1] 纯 Stock 基线测试：不引入 KernelSU，不修改任何系统调用文件。"
          elif [ "$STAGE" = "stage2_ksu_kprobe" ]; then
            echo ">>> [Stage 2] KernelSU-Next + Kprobe 模式：拉取 ($KSU_REF)，不修改 5 个系统调用文件。"
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_REF"
          elif [ "$STAGE" = "stage3_ksu_manual" ]; then
            echo ">>> [Stage 3] KernelSU-Next + 手动 Hook 备用模式：拉取 ($KSU_REF) 并注入 5 处系统调用 Hook。"
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_REF"
            python3 - << 'EOF'
          import os, re, sys

          def patch_file(filepath, check_str, target_regex, replacement):
              if not os.path.exists(filepath):
                  print(f"[ERROR] 找不到文件: {filepath}")
                  sys.exit(1)
              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              if check_str in content:
                  return
              new_content, count = re.subn(target_regex, replacement, content, count=1, flags=re.MULTILINE | re.DOTALL)
              if count == 0:
                  print(f"[ERROR] 未能在 {filepath} 匹配到目标函数签名！")
                  sys.exit(1)
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print(f"[OK] Stage 3 手动 Hook 已注入: {filepath}")

          exec_decl = (
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
              "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
              "#endif\n\n"
          )
          patch_file(
              "fs/exec.c",
              "ksu_handle_execveat",
              r"(int do_execve\(struct filename \*filename,.*?struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};)",
              exec_decl + r"\1" + "\n#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif"
          )

          open_decl = (
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
              "\t\t\t\tint *mode, int *flags);\n"
              "#endif\n\n"
          )
          patch_file(
              "fs/open.c",
              "ksu_handle_faccessat",
              r"(SYSCALL_DEFINE3\(faccessat,\s*int,\s*dfd,\s*const char __user \*,?\s*filename,\s*int,\s*mode\)\s*\{)",
              open_decl + r"\1" + "\n#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif"
          )

          rw_decl = (
              "#ifdef CONFIG_KSU\n"
              "extern bool ksu_vfs_read_hook __read_mostly;\n"
              "extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,\n"
              "\t\t\t\tchar __user **buf_ptr, size_t *count_ptr);\n"
              "#endif\n\n"
          )
          patch_file(
              "fs/read_write.c",
              "ksu_handle_sys_read",
              r"(SYSCALL_DEFINE3\(read,\s*unsigned int,\s*fd,\s*char __user \*,?\s*buf,\s*size_t,\s*count\)\s*\{.*?ssize_t ret = -EBADF;)",
              rw_decl + r"\1" + "\n#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_sys_read(fd, &buf, &count);\n#endif"
          )

          stat_decl = (
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
              "\t\t\t\tint *flags);\n"
              "#endif\n\n"
          )
          patch_file(
              "fs/stat.c",
              "ksu_handle_stat",
              r"(SYSCALL_DEFINE4\(newfstatat,\s*int,\s*dfd,\s*const char __user \*,?\s*filename,\s*struct stat __user \*,?\s*statbuf,\s*int,\s*flag\)\s*\{\s*struct kstat stat;\s*int error;)",
              stat_decl + r"\1" + "\n#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif"
          )

          reboot_decl = (
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
              "#endif\n\n"
          )
          patch_file(
              "kernel/reboot.c",
              "ksu_handle_sys_reboot",
              r"(SYSCALL_DEFINE4\(reboot,\s*int,\s*magic1,\s*int,\s*magic2,\s*unsigned int,\s*cmd,\s*void __user \*,?\s*arg\)\s*\{.*?int ret = 0;)",
              reboot_decl + r"\1" + "\n#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif"
          )
          EOF
          fi

      - name: "6. 导入 RMX3370_F21_config.gz 并自动提取/配置原厂模块签名公钥证书"
        working-directory: ${{ github.workspace }}/oplus_src/kernel/msm-4.19
        run: |
          STAGE="${{ inputs.build_stage || 'stage2_ksu_kprobe' }}"
          mkdir -p out certs

          BOOT_ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -iname "*boot*.zip" | head -n 1 || true)
          if [ -n "$BOOT_ZIP" ] && [ -f "$BOOT_ZIP" ] && [ ! -f "$GITHUB_WORKSPACE/boot.img" ]; then
            echo ">>> 检测到压缩的 $BOOT_ZIP，正在自动解压提取 boot.img..."
            unzip -o -j "$BOOT_ZIP" "*.img" -d "$GITHUB_WORKSPACE/" || true
          fi
          BOOT_GZ=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -iname "*boot*.img.gz" | head -n 1 || true)
          if [ -n "$BOOT_GZ" ] && [ -f "$BOOT_GZ" ] && [ ! -f "$GITHUB_WORKSPACE/boot.img" ]; then
            echo ">>> 检测到压缩的 $BOOT_GZ，正在自动解压提取 boot.img..."
            zcat "$BOOT_GZ" > "$GITHUB_WORKSPACE/boot.img" || true
          fi

          FOUND_GZ=$(find "$GITHUB_WORKSPACE" -maxdepth 2 \( -name "RMX3370_F21_config.gz" -o -name "*config*.gz" \) ! -iname "*boot*" | head -n 1 || true)
          if [ -n "$FOUND_GZ" ] && [ -f "$FOUND_GZ" ]; then
            echo ">>> 发现真机配置文件: $FOUND_GZ"
            zcat "$FOUND_GZ" > arch/arm64/configs/rmx3370_f21_defconfig
            TARGET_DEFCONFIG="rmx3370_f21_defconfig"
          else
            echo ">>> 未发现 config.gz，使用源码树内置 vendor/kona-perf_defconfig"
            TARGET_DEFCONFIG="vendor/kona-perf_defconfig"
          fi
          CONFIG_FILE="arch/arm64/configs/$TARGET_DEFCONFIG"

          sed -i '/CONFIG_SYSTEM_TRUSTED_KEYS=/d' "$CONFIG_FILE"
          sed -i '/CONFIG_SYSTEM_BLACKLIST_HASH_LIST=/d' "$CONFIG_FILE"
          sed -i '/CONFIG_INITRAMFS_SOURCE=/d' "$CONFIG_FILE"

          python3 - << 'EOF'
          import os, hashlib, subprocess

          ws = os.environ.get("GITHUB_WORKSPACE", ".")
          target_sha256 = "6a133a01dedfe1259e6948d8f618473e7d36d5a93091256e6e7566d3c53964ef"
          out_pem = "certs/stock_f21_module_key.pem"
          found = False

          for root_dir, _, files in os.walk(ws):
              if "oplus_src" in root_dir or "toolchains" in root_dir or ".git" in root_dir:
                  continue
              for fn in files:
                  fpath = os.path.join(root_dir, fn)
                  if fn.endswith((".pem", ".crt", ".cer", ".der", ".x509")):
                      for fmt in ("PEM", "DER"):
                          p = subprocess.run(
                              ["openssl", "x509", "-inform", fmt, "-in", fpath, "-outform", "DER"],
                              capture_output=True
                          )
                          if p.returncode == 0 and p.stdout:
                              h = hashlib.sha256(p.stdout).hexdigest().lower()
                              if h == target_sha256:
                                  subprocess.run(["openssl", "x509", "-inform", "DER", "-out", out_pem], input=p.stdout, check=True)
                                  print(f"[Cert Match] 已从文件 {fn} 验证并导入原厂模块签名公钥证书 (SHA256={h})")
                                  found = True
                                  break
                  if found:
                      break
              if found:
                  break

          if not found:
              for root_dir, _, files in os.walk(ws):
                  if "oplus_src" in root_dir or "toolchains" in root_dir or ".git" in root_dir:
                      continue
                  for fn in files:
                      if fn.endswith((".img", "Image", "kernel")) and os.path.getsize(os.path.join(root_dir, fn)) > 100000:
                          fpath = os.path.join(root_dir, fn)
                          with open(fpath, "rb") as bf:
                              data = bf.read()
                          idx = 0
                          while True:
                              idx = data.find(b"\x30\x82", idx)
                              if idx == -1 or idx + 4 > len(data):
                                  break
                              length = (data[idx + 2] << 8) | data[idx + 3]
                              total_len = length + 4
                              if 256 <= total_len <= 4096 and idx + total_len <= len(data):
                                  candidate = data[idx : idx + total_len]
                                  if hashlib.sha256(candidate).hexdigest().lower() == target_sha256:
                                      subprocess.run(["openssl", "x509", "-inform", "DER", "-out", out_pem], input=candidate, check=True)
                                      print(f"[Cert Extracted] 已直接从 {fn} 提取出原厂模块签名公钥证书 (SHA256={target_sha256})！")
                                      found = True
                                      break
                              idx += 1
                      if found:
                          break
                  if found:
                      break

          if not found:
              print("[Cert Notice] 仓库中暂未检测到原厂证书或原厂 boot.img，设置 CONFIG_SYSTEM_TRUSTED_KEYS=\"\" 以保证编译通过。")
          EOF

          if [ -f "certs/stock_f21_module_key.pem" ]; then
            echo 'CONFIG_SYSTEM_TRUSTED_KEYS="certs/stock_f21_module_key.pem"' >> "$CONFIG_FILE"
          else
            echo 'CONFIG_SYSTEM_TRUSTED_KEYS=""' >> "$CONFIG_FILE"
          fi

          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_LOCALVERSION="-perf"
          # CONFIG_LOCALVERSION_AUTO is not set
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_SIG=y
          CONFIG_MODULE_SIG_FORCE=y
          CONFIG_MODULE_SIG_ALL=y
          CONFIG_MODULE_SIG_SHA512=y
          CONFIG_SYSTEM_TRUSTED_KEYRING=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y
          # CONFIG_WERROR is not set
          EOF

          if [ "$STAGE" = "stage1_stock_baseline" ]; then
            echo "# CONFIG_KSU is not set" >> "$CONFIG_FILE"
          elif [ "$STAGE" = "stage2_ksu_kprobe" ]; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$CONFIG_FILE"
            echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          elif [ "$STAGE" = "stage3_ksu_manual" ]; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
            echo "# CONFIG_KSU_KPROBE_HOOKS is not set" >> "$CONFIG_FILE"
            echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          fi

          echo "TARGET_DEFCONFIG=$TARGET_DEFCONFIG" >> "$GITHUB_ENV"

      - name: "7. 编译内核并精确控制与校验 4.19.157-perf+ 版本号"
        working-directory: ${{ github.workspace }}/oplus_src/kernel/msm-4.19
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="dg02-pool06-kvm50"

          cat > scripts/setlocalversion << 'EOF'
          #!/bin/sh
          printf "%s" "-perf+"
          EOF
          chmod +x scripts/setlocalversion

          COMMON_ARGS=(
            O=out
            ARCH=arm64
            CC=clang
            HOSTCC=gcc
            HOSTCXX=g++
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
            DTC_EXT="$(which dtc)"
            LOCALVERSION=""
          )

          make "${COMMON_ARGS[@]}" "$TARGET_DEFCONFIG"
          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-perf" \
            -d LOCALVERSION_AUTO \
            -d WERROR || true
          make "${COMMON_ARGS[@]}" olddefconfig

          REL=$(make -s "${COMMON_ARGS[@]}" kernelrelease 2>/dev/null | tail -n 1 | tr -d '\r')
          echo ">>> 预检 kernelrelease: '$REL'"
          if [ "$REL" != "4.19.157-perf+" ]; then
            echo "[ERROR] kernelrelease ('$REL') 不等于 '4.19.157-perf+'！"
            exit 1
          fi

          set +e
          make -j$(nproc --all) "${COMMON_ARGS[@]}" Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          MAKE_RC=${PIPESTATUS[0]}
          set -e

          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "### ❌ 编译失败关键错误摘要 (Build Error Summary)" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error:|fatal error:|undefined|forbidden|No rule to make|can't open" "$GITHUB_WORKSPACE/build.log" | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || tail -n 80 "$GITHUB_WORKSPACE/build.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$MAKE_RC"
          fi

          VERSION_STR=$(strings out/arch/arm64/boot/Image | grep -E "^Linux version 4\.19\.157" | head -n 1 || true)
          echo ">>> 产物 Linux version: $VERSION_STR"
          echo "$VERSION_STR" | grep -F "4.19.157-perf+ "

          echo "### ✅ 编译成功与审计信息" >> "$GITHUB_STEP_SUMMARY"
          echo "- **阶段 (Stage)**: \`${{ inputs.build_stage || 'stage2_ksu_kprobe' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **kernelrelease**: \`$REL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image Version**: \`$VERSION_STR\`" >> "$GITHUB_STEP_SUMMARY"

          mkdir -p "$GITHUB_WORKSPACE/release_out"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/release_out/Image"
          cp out/Module.symvers "$GITHUB_WORKSPACE/release_out/Module.symvers" || true
          cp out/System.map "$GITHUB_WORKSPACE/release_out/System.map" || true
          cp out/.config "$GITHUB_WORKSPACE/release_out/final_kernel.config" || true

      - name: "8. 若仓库提供原厂 boot.img，按 Header v2 (4096 页 + 原厂 ramdisk + 31-DTB) 重建新 boot.img"
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/release_out/Image" ]; then
            exit 0
          fi
          STOCK_BOOT=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -iname "*boot*.img" ! -name "new-*" | head -n 1 || true)
          if [ -n "$STOCK_BOOT" ] && [ -f "$STOCK_BOOT" ]; then
            echo ">>> 检测到原厂 $STOCK_BOOT，正在按 Boot Header v2 (4096 页) 精确替换 Image 并保留原厂 ramdisk 与 31-DTB..."
            python3 - "$STOCK_BOOT" "$GITHUB_WORKSPACE/release_out/Image" "$GITHUB_WORKSPACE/release_out/new-boot-header-v2.img" << 'EOF'
          import sys, struct

          stock_path, new_kernel_path, out_path = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(stock_path, "rb") as f:
              boot = f.read()
          with open(new_kernel_path, "rb") as f:
              new_kernel = f.read()

          if boot[:8] != b"ANDROID!":
              print("[WARN] 非标准 ANDROID! boot 镜像头，跳过自动重打包。")
              sys.exit(0)

          kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size, second_addr, tags_addr, page_size, header_version = struct.unpack_from("<9I", boot, 8)
          dtb_size, dtb_addr = struct.unpack_from("<IQ", boot, 1632)
          print(f"[Boot v2] header_version={header_version}, page_size={page_size}, old_kernel_size={kernel_size}, ramdisk_size={ramdisk_size}, dtb_size={dtb_size}")

          def align(sz, pg):
              return ((sz + pg - 1) // pg) * pg

          def pad(blob, pg):
              rem = len(blob) % pg
              return blob + (b"\x00" * (pg - rem) if rem else b"")

          p_hdr = page_size
          p_ker = align(kernel_size, page_size)
          p_ram = align(ramdisk_size, page_size)
          p_sec = align(second_size, page_size)
          p_rec = 0
          if header_version >= 1:
              rec_dtbo_size, = struct.unpack_from("<I", boot, 1620)
              p_rec = align(rec_dtbo_size, page_size)
          p_dtb = align(dtb_size, page_size)

          off_ram = p_hdr + p_ker
          off_sec = off_ram + p_ram
          off_rec = off_sec + p_sec
          off_dtb = off_rec + p_rec

          ramdisk_blob = boot[off_ram : off_ram + ramdisk_size]
          second_blob = boot[off_sec : off_sec + second_size]
          rec_blob = boot[off_rec : off_rec + (rec_dtbo_size if header_version >= 1 else 0)]
          dtb_blob = boot[off_dtb : off_dtb + dtb_size]

          new_hdr = bytearray(boot[:page_size])
          struct.pack_into("<I", new_hdr, 8, len(new_kernel))

          repacked = (
              bytes(new_hdr)
              + pad(new_kernel, page_size)
              + pad(ramdisk_blob, page_size)
              + pad(second_blob, page_size)
              + pad(rec_blob, page_size)
              + pad(dtb_blob, page_size)
          )
          with open(out_path, "wb") as f:
              f.write(repacked)
          print(f"[Boot v2] 已生成重建后的 Header v2 镜像: {out_path} (保留原厂 gzip ramdisk 与 {dtb_size} 字节 31-DTB bundle)")
          EOF
          fi

      - name: "9. 上传编译产物 (Image / new-boot-header-v2.img / Module.symvers / build.log)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMX3370-F21-${{ inputs.build_stage || 'stage2_ksu_kprobe' }}-Package
          path: |
            ${{ github.workspace }}/release_out/*
            ${{ github.workspace }}/kernel_commit.txt
            ${{ github.workspace }}/build.log
