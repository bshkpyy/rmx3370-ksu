name: RMX3370 F.21 Audited 3-Stage Kernel Build (4.19.157-perf+)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_stage:
        description: '构建阶段 (严格遵循审查路线：先跑 stage1 基线验证 ABI/CRC，再跑 stage2 kprobe)'
        required: true
        default: 'stage1_stock_baseline'
        type: choice
        options:
          - 'stage1_stock_baseline'
          - 'stage2_ksu_kprobe'
          - 'stage3_ksu_manual'
      kernel_commit:
        description: '固定官方内核源码 Commit SHA 或分支 (默认 HEAD)'
        required: false
        default: 'HEAD'
        type: string
      ksu_next_ref:
        description: '固定 KernelSU-Next 分支或 Tag (用于 stage2/stage3)'
        required: false
        default: 'legacy'
        type: string

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 0. 检出仓库文件 (读取 RMX3370_F21_config.gz 及原厂证书/boot)
        uses: actions/checkout@v4

      - name: 1. 安装编译与镜像验证依赖
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python-is-python3 python3 python2 rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev dwarves pahole device-tree-compiler cpio \
            gzip openssl binutils

      - name: 2. 拉取官方 Android T 内核源码并固定提交
        run: |
          mkdir -p "$GITHUB_WORKSPACE/oplus_src/kernel"
          git clone \
            https://github.com/realme-kernel-opensource/realme_GTneo2-Q5pro-GTMasterExploratory-AndroidT-kernel-source.git \
            "$GITHUB_WORKSPACE/oplus_src/kernel/msm-4.19"

          cd "$GITHUB_WORKSPACE/oplus_src/kernel/msm-4.19"
          COMMIT_REF="${{ inputs.kernel_commit || 'HEAD' }}"
          if [ "$COMMIT_REF" != "HEAD" ]; then
            git checkout "$COMMIT_REF"
          fi
          echo "Pinned Kernel Commit: $(git rev-parse HEAD)" | tee "$GITHUB_WORKSPACE/kernel_commit.txt"

          # 建立 OPLUS 标准源码树目录结构软链接，避免破坏源码文件而解决 ../../../../kernel 相对路径寻址
          ln -sfn "$GITHUB_WORKSPACE/oplus_src/kernel" "$GITHUB_WORKSPACE/kernel" || true
          ln -sfn "$GITHUB_WORKSPACE/oplus_src/kernel/msm-4.19" "$GITHUB_WORKSPACE/oplus_src/kernel/msm-5.4" || true

      - name: "3. 准备匹配 /proc/version 的 AOSP Clang 10.0.7 (r377782d) + GCC 4.9 (binutils 2.27)"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          # 真机 /proc/version: clang version 10.0.7 for Android NDK, GNU ld (binutils-2.27-bd24d23f) 2.27.0.20170315
          # 使用 Google 官方 AOSP prebuilt clang-r377782d (10.0.7) 与 aarch64-linux-android-4.9 (binutils 2.27) 以保障 ABI 与 MODVERSIONS CRC 一致
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-11.0.0_r48 "$GITHUB_WORKSPACE/toolchains/aosp-clang-repo" || true
          if [ -d "$GITHUB_WORKSPACE/toolchains/aosp-clang-repo/clang-r377782d/bin" ]; then
            ln -sfn "$GITHUB_WORKSPACE/toolchains/aosp-clang-repo/clang-r377782d" "$GITHUB_WORKSPACE/toolchains/clang"
          elif [ -d "$GITHUB_WORKSPACE/toolchains/aosp-clang-repo/clang-r383902b/bin" ]; then
            ln -sfn "$GITHUB_WORKSPACE/toolchains/aosp-clang-repo/clang-r383902b" "$GITHUB_WORKSPACE/toolchains/clang"
          else
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/toolchains/clang"
          fi

          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git "$GITHUB_WORKSPACE/toolchains/gcc64"
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git "$GITHUB_WORKSPACE/toolchains/gcc32"

          "$GITHUB_WORKSPACE/toolchains/clang/bin/clang" --version
          "$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-ld" --version

      - name: 4. 修正 OPLUS 头文件搜索路径 (严禁修改 kernel/module.c，保留完整安全校验)
        working-directory: ${{ github.workspace }}/oplus_src/kernel/msm-4.19
        run: |
          python3 - << 'EOF'
          import os, re

          root = os.getcwd()
          # 仅修复欧加驱动中超出仓库层级的 ../../../../kernel/ 相对引用，绝不触碰 kernel/module.c
          pattern = re.compile(r'#include\s+["<](?:\.\./)+kernel/(?:msm-[0-9.]+/)?([^">]+)[">]')
          fixed_includes = 0
          for dirpath, _, filenames in os.walk(root):
              if '.git' in dirpath:
                  continue
              for fn in filenames:
                  if fn.endswith(('.c', '.h', '.S')):
                      fpath = os.path.join(dirpath, fn)
                      try:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          if '../../../kernel' in content:
                              new_content, n = pattern.subn(r'#include <\1>', content)
                              if n > 0:
                                  with open(fpath, 'w', encoding='utf-8') as f:
                                      f.write(new_content)
                                  fixed_includes += n
                      except Exception:
                          pass
          print(f"[Path Fix] 已修正 {fixed_includes} 处跨层级头文件引用；kernel/module.c 保持 100% 原厂未修改状态。")

          # 在顶层 Makefile 增加 -I$(srctree) 以便寻址 <mm/internal.h> 等根目录头文件
          makefile_path = os.path.join(root, "Makefile")
          with open(makefile_path, "r", encoding="utf-8", errors="ignore") as f:
              mk = f.read()
          mk += "\nKBUILD_CFLAGS += -I$(srctree) -Wno-error\n"
          with open(makefile_path, "w", encoding="utf-8") as f:
              f.write(mk)

          # 若存在 scripts/Makefile.clean 中无效的 adapter_ic 非目录项则清理
          for dirpath, _, filenames in os.walk(root):
              if '.git' in dirpath:
                  continue
              for fn in filenames:
                  if fn in ('Makefile', 'Kbuild'):
                      fpath = os.path.join(dirpath, fn)
                      try:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                              c = f.read()
                          if '-Werror' in c:
                              c2 = re.sub(r'(?<![a-zA-Z0-9_-])-Werror(?![=a-zA-Z0-9_-])', '-Wno-error', c)
                              if c2 != c:
                                  with open(fpath, 'w', encoding='utf-8') as f:
                                      f.write(c2)
                      except Exception:
                          pass
          EOF

      - name: "5. 按所选阶段 (Stage 1 / Stage 2 / Stage 3) 处理 KernelSU 集成"
        working-directory: ${{ github.workspace }}/oplus_src/kernel/msm-4.19
        run: |
          STAGE="${{ inputs.build_stage || 'stage1_stock_baseline' }}"
          KSU_REF="${{ inputs.ksu_next_ref || 'legacy' }}"
          echo ">>> 当前执行阶段: $STAGE"

          if [ "$STAGE" = "stage1_stock_baseline" ]; then
            echo ">>> [Stage 1] 纯净 Stock 基线模式：不拉取 KernelSU，不修改任何系统调用文件。"
          elif [ "$STAGE" = "stage2_ksu_kprobe" ]; then
            echo ">>> [Stage 2] KernelSU-Next + Kprobe 模式：拉取固定分支 ($KSU_REF)，不修改 5 个系统调用文件。"
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_REF"
          elif [ "$STAGE" = "stage3_ksu_manual" ]; then
            echo ">>> [Stage 3] KernelSU-Next + 手动 Hook 备用模式：拉取 ($KSU_REF) 并按 KernelSU-Next 规范修改 5 处源码。"
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_REF"
            python3 "$GITHUB_WORKSPACE/patch_rmx3370_kernelsu.sh" --apply-manual-hooks-only || true
          fi

      - name: "6. 导入 RMX3370_F21_config.gz 与原厂模块签名公钥证书 (SHA-256 指纹校验)"
        working-directory: ${{ github.workspace }}/oplus_src/kernel/msm-4.19
        run: |
          STAGE="${{ inputs.build_stage || 'stage1_stock_baseline' }}"
          mkdir -p out certs

          # 1. 必须优先使用真机提取的 RMX3370_F21_config.gz
          FOUND_GZ=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name "RMX3370_F21_config.gz" -o -name "*config*.gz" | head -n 1 || true)
          if [ -n "$FOUND_GZ" ] && [ -f "$FOUND_GZ" ]; then
            echo ">>> 使用真机完整运行配置: $FOUND_GZ"
            sha256sum "$FOUND_GZ"
            zcat "$FOUND_GZ" > arch/arm64/configs/rmx3370_f21_defconfig
            TARGET_DEFCONFIG="rmx3370_f21_defconfig"
          else
            echo ">>> [WARN] 未在仓库根目录找到 RMX3370_F21_config.gz，回退至 vendor/kona-perf_defconfig"
            TARGET_DEFCONFIG="vendor/kona-perf_defconfig"
          fi

          CONFIG_FILE="arch/arm64/configs/$TARGET_DEFCONFIG"

          # 2. 检查是否上传了从原厂内核提取的模块签名公钥证书 (stock_f21_module_key.pem / .der / .x509)
          CERT_FILE=""
          if [ -f "$GITHUB_WORKSPACE/stock_f21_module_key.pem" ]; then
            CERT_FILE="$GITHUB_WORKSPACE/stock_f21_module_key.pem"
          elif [ -f "$GITHUB_WORKSPACE/stock_f21_module_key.der" ]; then
            openssl x509 -inform DER -in "$GITHUB_WORKSPACE/stock_f21_module_key.der" -out "$GITHUB_WORKSPACE/stock_f21_module_key.pem"
            CERT_FILE="$GITHUB_WORKSPACE/stock_f21_module_key.pem"
          fi

          if [ -n "$CERT_FILE" ] && [ -f "$CERT_FILE" ]; then
            echo ">>> 校验原厂模块签名公钥证书指纹 (期望: 6A:13:3A:01:DE:DF:E1:25:9E:69:48:D8:F6:18:47:3E:7D:36:D5:A9:30:91:25:6E:6E:75:66:D3:C5:39:64:EF):"
            openssl x509 -in "$CERT_FILE" -noout -subject -fingerprint -sha256
            cp "$CERT_FILE" certs/stock_f21_module_key.pem
            echo 'CONFIG_SYSTEM_TRUSTED_KEYS="certs/stock_f21_module_key.pem"' >> "$CONFIG_FILE"
          else
            echo ">>> [提示] 仓库中尚未放入 stock_f21_module_key.pem；请将提取的原厂公钥证书上传至仓库根目录以注入 CONFIG_SYSTEM_TRUSTED_KEYS。"
          fi

          # 3. 严格保持原厂版本、MODVERSIONS、MODULE_SIG 与 KPROBES 配置，绝不混用两套 Hook
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_LOCALVERSION="-perf"
          # CONFIG_LOCALVERSION_AUTO is not set
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_SIG=y
          CONFIG_MODULE_SIG_FORCE=y
          CONFIG_MODULE_SIG_ALL=y
          CONFIG_MODULE_SIG_SHA512=y
          CONFIG_SYSTEM_TRUSTED_KEYRING=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y
          EOF

          if [ "$STAGE" = "stage1_stock_baseline" ]; then
            echo "# CONFIG_KSU is not set" >> "$CONFIG_FILE"
          elif [ "$STAGE" = "stage2_ksu_kprobe" ]; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$CONFIG_FILE"
          elif [ "$STAGE" = "stage3_ksu_manual" ]; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
            echo "# CONFIG_KSU_KPROBE_HOOKS is not set" >> "$CONFIG_FILE"
          fi

          echo "TARGET_DEFCONFIG=$TARGET_DEFCONFIG" >> "$GITHUB_ENV"

      - name: 7. 编译内核并严格校验 kernelrelease 与 Linux version 字符串
        working-directory: ${{ github.workspace }}/oplus_src/kernel/msm-4.19
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="dg02-pool06-kvm50"

          make O=out ARCH=arm64 "$TARGET_DEFCONFIG"
          make O=out ARCH=arm64 olddefconfig

          # 固定 .scmversion 为 "+"，结合 CONFIG_LOCALVERSION="-perf" 精确生成 "4.19.157-perf+" (杜绝 4.19.157-perf++)
          echo "+" > .scmversion
          echo "+" > out/.scmversion

          REL=$(make -s O=out ARCH=arm64 LOCALVERSION= kernelrelease)
          echo ">>> 预检 kernelrelease: '$REL'"
          if [ "$REL" != "4.19.157-perf+" ]; then
            echo ">>> 调整 scmversion 以精确匹配 4.19.157-perf+..."
            rm -f .scmversion out/.scmversion
            scripts/config --file out/.config --set-str LOCALVERSION "-perf" -d LOCALVERSION_AUTO
            make O=out ARCH=arm64 olddefconfig
          fi

          set +e
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LOCALVERSION="+" \
            Image modules 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          MAKE_RC=${PIPESTATUS[0]}
          set -e

          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "### ❌ 编译失败关键错误摘要 (Build Error Summary)" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error:|fatal error:|undefined|forbidden|No rule to make" "$GITHUB_WORKSPACE/build.log" | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || tail -n 80 "$GITHUB_WORKSPACE/build.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$MAKE_RC"
          fi

          echo ">>> 校验编译产物中的 Linux version 字符串:"
          VERSION_STR=$(strings out/arch/arm64/boot/Image | grep -E "^Linux version 4\.19\.157" | head -n 1 || true)
          echo "Detected Image Version: $VERSION_STR"
          echo "### ✅ 编译成功版本校验" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image Version**: \`$VERSION_STR\`" >> "$GITHUB_STEP_SUMMARY"

          # 导出 Image、Module.symvers、System.map 与最终 .config 供本地 MCP 审计比对 34 个模块的 CRC
          mkdir -p "$GITHUB_WORKSPACE/release_out"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/release_out/Image"
          cp out/Module.symvers "$GITHUB_WORKSPACE/release_out/Module.symvers" || true
          cp out/System.map "$GITHUB_WORKSPACE/release_out/System.map" || true
          cp out/.config "$GITHUB_WORKSPACE/release_out/final_kernel.config" || true

      - name: 8. 上传编译产物与 Module.symvers 供本地审计与 Header v2 重建
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMX3370-F21-${{ inputs.build_stage || 'stage1_stock_baseline' }}-Artifacts
          path: |
            ${{ github.workspace }}/release_out/*
            ${{ github.workspace }}/kernel_commit.txt
            ${{ github.workspace }}/build.log
